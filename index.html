<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🥡 중국집에서 하는 말 — 수업 자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E9; --card:#FFFFFF; --ink:#2B2320; --sub:#7A6A5E; --line:#EADCC8; --soft:#FBEFDD;
  --red:#C8352E; --red2:#E25A45; --gold:#E9A436; --jade:#2E9C7C; --blue:#3B7DD8; --pink:#E0558F;
  --ok:#1F9D6B; --ok-soft:#E3F6EC; --no:#D9534F; --no-soft:#FCE9E8;
  --shadow:0 2px 0 rgba(0,0,0,.04),0 10px 26px rgba(90,50,20,.12);
  --st:#3B7DD8; --st-soft:#E4EEFB;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:500;
  background-image:radial-gradient(circle at 12px 12px,rgba(200,53,46,.07) 2px,transparent 2.5px);background-size:24px 24px;-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
input,select,textarea{font:inherit;color:inherit;}
.j{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;}
.hidden{display:none!important;}
#app{min-height:100%;display:flex;flex-direction:column;}

/* ─── 위쪽 막대 ─── */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--red);color:#fff;flex-wrap:wrap;position:sticky;top:0;z-index:30;
  box-shadow:0 4px 0 #9E2620;}
.brand{font-family:'Jua',sans-serif;font-size:22px;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.brand small{font-size:13px;opacity:.85;font-family:'Noto Sans KR',sans-serif;}
.stages{display:flex;gap:6px;flex-wrap:wrap;}
.stages button{font-family:'Jua',sans-serif;font-size:16px;padding:7px 13px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap;}
.stages button.on{background:#fff;color:var(--red);box-shadow:0 3px 0 #9E2620;}
.stages button b{display:inline-block;background:var(--gold);color:#3a2300;border-radius:999px;width:20px;height:20px;font-size:13px;line-height:20px;text-align:center;margin-right:4px;}
.stages button.on b{background:var(--red);color:#fff;}
.topr{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.who{display:flex;gap:4px;background:rgba(0,0,0,.18);padding:4px;border-radius:14px;}
.who button{font-family:'Jua',sans-serif;font-size:16px;padding:5px 11px;border-radius:10px;color:#fff;opacity:.75;white-space:nowrap;}
.who button.on{background:#fff;color:var(--c);opacity:1;}
.tbtn{font-size:18px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);}
.tbtn.on{background:#fff;color:var(--red);}
.tbtn.txt{width:auto;padding:0 12px;font-family:'Jua',sans-serif;font-size:16px;}
main{flex:1;min-height:0;}
.view{max-width:1240px;margin:0 auto;padding:18px 16px 40px;}

/* ─── 공통 조각 ─── */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;}
.h2{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.h3{font-family:'Jua',sans-serif;font-weight:400;font-size:21px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.sub{color:var(--sub);font-size:14px;line-height:1.6;}
.chip{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--soft);margin:2px 3px 2px 0;white-space:nowrap;}
.chip.st{background:var(--st-soft);color:var(--st);font-weight:700;}
.btn{font-family:'Jua',sans-serif;font-size:17px;padding:9px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);white-space:nowrap;}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line);}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 0 #9E2620;}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2300;box-shadow:0 3px 0 #B87A1C;}
.btn.jade{background:var(--jade);border-color:var(--jade);color:#fff;box-shadow:0 3px 0 #1E6F57;}
.btn.st{background:var(--st);border-color:var(--st);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--st) 70%,#000);}
.btn.sm{font-size:14px;padding:5px 10px;border-radius:10px;}
.btn:disabled{opacity:.4;pointer-events:none;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.grow{flex:1;}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:14px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:all .2s;z-index:90;max-width:90vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%);}
.pop{animation:pop .35s;} @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:none}}
.shake{animation:shake .35s;} @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 한 문장씩 들어오기 */
.enter{animation:enter .4s cubic-bezier(.2,.8,.2,1) both;}
.enter.back{animation-name:enterBack;}
@keyframes enter{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
.drop{animation:drop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*.55s);}
@keyframes drop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.dots{display:inline-flex;gap:7px;align-items:center;}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);}
.dots i.on{background:var(--st);}
.npc .b.one{font-size:clamp(24px,3.4vw,38px);padding:16px 22px;}
.dlgin.solo{padding:22px 24px;}
.say.sm{font-size:clamp(28px,4.4vw,54px);}

/* ─── 수업 안내 ─── */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px;}
.hero .card{position:relative;overflow:hidden;}
.hero h1{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(30px,4.4vw,48px);line-height:1.1;}
.hero h1 em{font-style:normal;color:var(--red);}
.goalbox{background:var(--soft);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.55;}
.goalbox::before{content:'🎯 차시 목표';display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:15px;color:var(--red);margin-bottom:2px;}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.fstep{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;border-top:6px solid var(--fc);}
.fstep .n{font-family:'Jua',sans-serif;color:var(--fc);font-size:15px;}
.fstep .t{font-family:'Jua',sans-serif;font-size:21px;margin:2px 0 4px;}
.fstep .d{font-size:13.5px;color:var(--sub);line-height:1.5;}
.fstep .m{float:right;font-size:12px;background:var(--soft);border-radius:999px;padding:2px 8px;color:var(--sub);}
.studs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;}
.scard{border-left:10px solid var(--st);}
.scard .nm{font-family:'Jua',sans-serif;font-size:26px;display:flex;align-items:center;gap:8px;}
.scard .nm .ic{font-size:40px;}
.scard .fo{font-size:13px;font-weight:700;background:var(--st-soft);color:var(--st);border-radius:999px;padding:3px 10px;}
.scard .g{font-size:16px;font-weight:700;line-height:1.55;margin:8px 0;}
.levt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
.levt th,.levt td{border-bottom:1.5px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top;line-height:1.5;}
.levt th{color:var(--sub);font-weight:700;font-size:12px;}
.levt td.c{white-space:nowrap;font-family:'Jua',sans-serif;color:var(--st);}
.recs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.recs span{background:var(--soft);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700;}
.src{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:14px;border-top:1.5px dashed var(--line);padding-top:10px;}

/* ─── 동기유발: 중국집 놀이 ─── */
.play{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start;}
.mapwrap{position:relative;}
.map{position:relative;width:100%;aspect-ratio:16/10;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);border:6px solid #8B2A23;
  background:
    linear-gradient(#B8402F 0 15%,#8B2A23 15% 16.5%,transparent 16.5%),
    repeating-conic-gradient(#F3E0C2 0 25%,#EBD3AE 0 50%) 0 0/8% 12.8%;
  touch-action:none;user-select:none;-webkit-user-select:none;}
.map::after{content:'';position:absolute;left:0;right:0;top:0;height:15%;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,215,120,.18) 46px 52px);pointer-events:none;}
.sign{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);font-family:'Jua',sans-serif;color:#FFE08A;font-size:clamp(16px,2.4vw,28px);
  background:#7A1E18;border:3px solid #E9A436;border-radius:10px;padding:2px 18px;z-index:2;white-space:nowrap;letter-spacing:2px;}
.obj{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3;}
.obj .e{line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18));}
.obj .l{font-family:'Jua',sans-serif;font-size:clamp(11px,1.3vw,15px);background:rgba(255,255,255,.88);border-radius:999px;padding:0 8px;margin-top:2px;white-space:nowrap;}
.obj.target::before{content:'❗';position:absolute;top:-34%;font-size:clamp(18px,2.6vw,30px);animation:bob .8s infinite alternate;}
@keyframes bob{to{transform:translateY(-8px)}}
.obj .food{position:absolute;top:-6%;font-size:.5em;}
.map.edit .obj{cursor:move;outline:2px dashed rgba(59,125,216,.5);outline-offset:4px;border-radius:10px;}
.map.edit .obj.sel{outline:3px solid var(--blue);}
.me{position:absolute;transform:translate(-50%,-80%);z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:none;}
.me .e{font-size:clamp(34px,5.4vw,62px);line-height:1;filter:drop-shadow(0 5px 2px rgba(0,0,0,.25));}
.me .e.flip{transform:scaleX(-1);}
.me .tag{font-family:'Jua',sans-serif;font-size:13px;background:var(--st);color:#fff;border-radius:999px;padding:0 8px;margin-top:-2px;}
.me.walk .e{animation:walk .28s infinite alternate;}
@keyframes walk{to{translate:0 -4px}}
.talkbtn{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:8;font-family:'Jua',sans-serif;font-size:clamp(18px,2.4vw,26px);
  background:var(--gold);color:#3a2300;border-radius:999px;padding:10px 26px;box-shadow:0 5px 0 #B87A1C;animation:pop .35s;}
.pad{position:absolute;right:2%;bottom:4%;z-index:7;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:3px;opacity:.9;}
.pad button{background:rgba(255,255,255,.9);border-radius:12px;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.15);}
.pad button:active{background:var(--gold);}
.dlg{position:absolute;inset:0;z-index:10;background:rgba(43,35,32,.45);display:flex;align-items:flex-end;justify-content:center;padding:3%;}
.dlgin{width:min(760px,100%);background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .3s;}
.npc{display:flex;gap:12px;align-items:flex-start;}
.npc .e{font-size:54px;line-height:1;}
.npc .b{background:var(--soft);border-radius:6px 20px 20px 20px;padding:10px 16px;font-size:clamp(18px,2.3vw,24px);font-weight:700;line-height:1.45;flex:1;}
.npc .b small{display:block;font-size:13px;color:var(--sub);}
.ask{font-family:'Jua',sans-serif;font-size:18px;color:var(--st);margin:12px 0 8px;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{text-align:left;font-size:clamp(17px,2.2vw,22px);font-weight:700;padding:10px 16px;border-radius:16px;background:var(--card);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);}
.opt:hover{border-color:var(--st);}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
.opt.no{background:var(--no-soft);border-color:var(--no);color:var(--no);}
.opt.hint{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,164,54,.35);}
.menupick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.menupick button{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:8px 14px;min-width:110px;}
.menupick button .e{font-size:48px;display:block;}
.menupick button b{font-family:'Jua',sans-serif;font-weight:400;font-size:22px;}
.menupick button:hover{border-color:var(--red);}
.side .card{padding:14px 16px;margin-bottom:12px;}
.ql{list-style:none;display:flex;flex-direction:column;gap:6px;}
.ql li{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:700;padding:6px 8px;border-radius:12px;}
.ql li .k{width:26px;height:26px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;flex-shrink:0;}
.ql li.cur{background:var(--st-soft);color:var(--st);}
.ql li.cur .k{background:var(--st);color:#fff;}
.ql li.done{color:var(--sub);text-decoration:line-through;}
.ql li.done .k{background:var(--ok);color:#fff;}
.stars{font-size:22px;letter-spacing:2px;}
.prop label{font-size:13px;color:var(--sub);font-weight:700;display:block;margin-top:8px;}
.prop input,.prop select{width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;}
.emopick{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.emopick button{font-size:22px;width:34px;height:34px;border-radius:8px;}
.emopick button:hover{background:var(--soft);}

/* ─── 보여주기 ─── */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.tabs button{font-family:'Jua',sans-serif;font-size:18px;padding:9px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.tabs button i{font-style:normal;font-size:12px;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--sub);font-family:'Noto Sans KR',sans-serif;font-weight:700;}
.tabs button.on i{background:rgba(255,255,255,.2);color:#fff;}
.lvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.lv{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px;}
.lv button{font-family:'Jua',sans-serif;font-size:15px;padding:5px 12px;border-radius:10px;}
.lv button.on{background:var(--st);color:#fff;}
.stage{background:var(--card);border-radius:26px;box-shadow:var(--shadow);border-top:10px solid var(--st);min-height:min(66vh,620px);display:flex;flex-direction:column;padding:18px clamp(16px,3vw,34px);gap:12px;position:relative;}
.kick{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--sub);flex-wrap:wrap;}
.kick b{background:var(--st);color:#fff;font-family:'Jua',sans-serif;font-weight:400;padding:3px 11px;border-radius:999px;}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;}
.sit{font-size:clamp(70px,10vw,120px);line-height:1;}
.sitt{font-family:'Jua',sans-serif;font-size:clamp(20px,2.8vw,30px);color:var(--sub);}
.say{font-family:'Jua',sans-serif;font-size:clamp(34px,5.6vw,68px);line-height:1.25;word-break:keep-all;}
.say .w{display:inline-block;margin:0 .14em;}
.say .w.dim{color:transparent;border-bottom:5px dashed var(--line);}
.prompts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.prompts button{font-size:15px;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--soft);border:2px solid var(--line);}
.prompts button.on{background:var(--gold);border-color:var(--gold);color:#3a2300;}
.navb{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:12px;}
.navb .cnt{font-family:'Jua',sans-serif;font-size:18px;min-width:70px;text-align:center;}
.recb{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.recb button{font-size:15px;font-weight:700;padding:7px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;}
.recb button.on.a{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
.recb button.on.b{background:#FFF3DA;border-color:var(--gold);color:#9A6200;}
.recb button.on.c{background:var(--no-soft);border-color:var(--no);color:var(--no);}
.sayl{font-size:22px;padding:8px 16px;border-radius:14px;background:var(--st-soft);color:var(--st);font-family:'Jua',sans-serif;}
/* 칸 쓰기 */
.gridwrap{position:relative;align-self:center;max-width:100%;}
.gboxes{display:flex;flex-wrap:wrap;gap:0;justify-content:center;}
.gb{width:var(--gs,92px);height:var(--gs,92px);border:2.5px solid #D9A99A;margin:-1.25px;display:flex;align-items:center;justify-content:center;position:relative;
  font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:calc(var(--gs,92px)*.68);line-height:1;background:#fff;
  background-image:linear-gradient(#F3D7CF,#F3D7CF),linear-gradient(#F3D7CF,#F3D7CF);background-size:100% 1.5px,1.5px 100%;background-position:center;background-repeat:no-repeat;}
.gb.g1{color:#C9C2BC;} .gb.g2{color:transparent;-webkit-text-stroke:1.4px #CFC7C0;} .gb.g0{color:transparent;}
.gb.sp{background:#FBF4EA;border-color:#EFD9CE;}
.gbrk{flex-basis:100%;height:10px;}
.ink{position:absolute;inset:0;touch-action:none;cursor:crosshair;}
.model{font-family:'Jua',sans-serif;font-size:clamp(26px,3.6vw,40px);color:var(--st);}
.wordbig{display:flex;gap:6px;justify-content:center;}
.wordbig button{font-family:'Jua',sans-serif;font-size:clamp(70px,12vw,150px);line-height:1.1;padding:4px 14px;border-radius:22px;background:var(--soft);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);}
.wordbig button:active,.wordbig button.lit{background:var(--st);color:#fff;border-color:var(--st);}
.snd{font-family:'Jua',sans-serif;font-size:clamp(22px,3vw,32px);background:#FFF3DA;color:#9A6200;border-radius:16px;padding:6px 16px;}

/* ─── 활동지 ─── */
.wsl{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;}
.wsopt{position:sticky;top:76px;}
.wsopt label.ck{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:700;padding:5px 4px;}
.wsopt label.ck input{width:18px;height:18px;}
.wsopt select{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;width:100%;}
.wsopt h4{font-size:13px;color:var(--sub);margin:12px 0 4px;}
.papers{display:flex;flex-direction:column;gap:20px;align-items:center;}
.paper{width:210mm;max-width:100%;min-height:297mm;background:#fff;color:#222;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:13mm 14mm;position:relative;font-family:'Noto Sans KR',sans-serif;}
.paper .ph{display:flex;align-items:flex-end;gap:10px;border-bottom:3px solid #C8352E;padding-bottom:6px;margin-bottom:10px;}
.paper .ph h1{font-family:'Jua',sans-serif;font-weight:400;font-size:26px;flex:1;}
.paper .ph .nm{font-size:14px;white-space:nowrap;}
.paper .ph .nm span{display:inline-block;min-width:80px;border-bottom:1.5px solid #333;text-align:center;font-weight:700;}
.paper .pg{font-size:14px;background:#FFF4E6;border-radius:10px;padding:6px 10px;margin-bottom:10px;}

  background-image:linear-gradient(#EFD7CF,#EFD7CF),linear-gradient(#EFD7CF,#EFD7CF);background-size:100% 1px,1px 100%;background-position:center;background-repeat:no-repeat;}

/* ─── 마무리 게임 ─── */
.gsetup{max-width:760px;margin:0 auto;text-align:center;}

.tray{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:10px 14px;border-top:8px solid var(--st);display:flex;align-items:center;gap:10px;min-height:86px;}
.tray.on{box-shadow:0 0 0 4px var(--st),var(--shadow);}
.tray .nm{font-family:'Jua',sans-serif;font-size:20px;white-space:nowrap;}
.tray .dish{flex:1;display:flex;flex-wrap:wrap;gap:2px;font-size:30px;min-height:36px;background:repeating-linear-gradient(45deg,#FBEFDD 0 10px,#F6E4C9 10px 20px);border-radius:14px;padding:4px 8px;}

.gq{grid-column:1/-1;}
.order{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;}
.order .bub{background:var(--soft);border-radius:22px;padding:12px 20px;font-family:'Jua',sans-serif;font-size:clamp(22px,3vw,32px);max-width:620px;}

/* ─── 🔄 말 차례 놀이 ─── */
.tg-set{max-width:820px;margin:0 auto;}
.tg-hero{display:flex;justify-content:center;align-items:center;gap:14px;font-size:64px;line-height:1;}
.tg-hero .sw{font-size:36px;}
.tg-roles{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;}
.tg-role{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--soft);border-radius:18px;padding:12px 16px;min-width:220px;}
.tg-role .ri{font-size:44px;line-height:1;}
.tg-role select{border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font-size:16px;width:100%;}
.tg-help{text-align:center;background:var(--soft);border-radius:14px;padding:10px 12px;}
.tg-play{display:flex;flex-direction:column;gap:12px;position:relative;}
.tg-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tg-sides{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;}
.tg-side{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow);border-top:8px solid var(--st);opacity:.55;}
.tg-side.on{opacity:1;box-shadow:0 0 0 4px var(--st),var(--shadow);}
.tg-side .ava{font-size:48px;line-height:1;}
.tg-side.on .ava{animation:bob .6s ease-in-out infinite alternate;}
.tg-side .nm{font-size:clamp(20px,2.6vw,28px);color:var(--st);}
.tg-side .rl{font-size:14px;color:var(--sub);}
.tg-arrow{font-size:30px;color:var(--sub);}
.tg-main{display:flex;flex-direction:column;gap:12px;min-height:min(52vh,460px);}
.tg-prev{display:flex;gap:10px;align-items:flex-start;}
.tg-prev .ava{font-size:34px;line-height:1;}
.tg-prev>div{background:var(--soft);border-radius:6px 18px 18px 18px;padding:8px 14px;font-size:clamp(17px,2vw,21px);font-weight:700;}
.tg-prev small{display:block;font-size:12.5px;color:var(--sub);font-weight:500;}
.tg-sit{font-size:15px;color:var(--sub);text-align:center;}
.tg-ask{font-family:'Jua',sans-serif;font-size:22px;color:var(--st);text-align:center;}
.tg-bub{align-self:center;background:var(--st-soft,var(--soft));border:3px solid var(--st);border-radius:24px;padding:14px 24px;font-family:'Jua',sans-serif;font-size:clamp(30px,5vw,54px);line-height:1.25;text-align:center;max-width:100%;}
.tg-open span{display:inline!important;font-style:normal;}
.tg-open .o{color:var(--ink);}
.tg-open .x{color:#B9A99B;}
.tg-opts{max-width:620px;width:100%;align-self:center;}
.tg-opts .opt{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(20px,2.6vw,28px);text-align:center;}
.tg-mark{margin-top:auto;border-top:2px dashed var(--line);padding-top:12px;}
.tg-mark button{font-size:17px;padding:10px 16px;}
.tg-swap{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(255,246,233,.82);border-radius:22px;}
.tg-swap div{font-family:'Jua',sans-serif;font-size:clamp(30px,5vw,52px);display:flex;align-items:center;gap:14px;animation:pop .35s;}
.tg-swap span{display:inline-block;animation:spin .9s ease-in-out;}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:640px){.tg-sides{grid-template-columns:1fr;}.tg-arrow{display:none;}}
@media (prefers-reduced-motion:reduce){.tg-side.on .ava,.tg-swap span{animation:none;}}

/* ─── 🗺️ 마을 모험 ─── */
.g-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;max-width:920px;margin:0 auto;}
.g-pick button{background:var(--card);border-radius:26px;box-shadow:var(--shadow);border-top:10px solid var(--c);padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.g-pick button:hover{box-shadow:0 0 0 4px var(--c),var(--shadow);}
.g-pick .ic{font-size:72px;line-height:1;}
.g-pick .t{font-family:'Jua',sans-serif;font-size:28px;color:var(--c);}
.g-pick .d{font-size:15px;color:var(--sub);line-height:1.55;}
.g-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;}
.g-tabs button{font-family:'Jua',sans-serif;font-size:17px;padding:8px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);}
.g-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.rpg-wrap{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;}
.rpg-hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;width:100%;}
.rpg-turn{font-family:'Jua',sans-serif;font-size:clamp(18px,2.4vw,24px);background:var(--st);color:#fff;border-radius:16px;padding:8px 16px;}
.rpg-quest{font-family:'Jua',sans-serif;font-size:clamp(15px,2vw,19px);background:#fff8e8;border:3px solid #ffd58a;border-radius:16px;padding:8px 16px;color:#6b4a1e;flex:1 1 260px;text-align:center;}
.rpg-coin{font-family:'Jua',sans-serif;font-size:clamp(16px,2.2vw,21px);background:#fff;border:3px solid #e2d8c6;border-radius:999px;padding:6px 14px;color:#8a6d3b;}
.rpg-tg{font-family:'Jua',sans-serif;font-size:15px;padding:6px 12px;border-radius:999px;border:2px solid #e2d8c6;background:#fff;color:#8a6d3b;}
.rpg-scene{position:relative;width:min(100%,calc(var(--cols)*64px),max(320px,calc((100vh - 330px)*var(--cols)/var(--rows))));}
.rpg-map{position:relative;display:grid;grid-template-columns:repeat(var(--cols),1fr);width:100%;aspect-ratio:var(--cols)/var(--rows);border:6px solid #b9895a;border-radius:18px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.12);background:#8fcf7a;user-select:none;-webkit-user-select:none;}
.rt{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2.6vw,26px);line-height:1;cursor:pointer;}
.rt.g{background:#9ad884;} .rt.g:nth-child(odd){background:#94d47e;}
.rt.r{background:#e6d7b8;box-shadow:inset 0 0 0 1px #d8c6a2;}
.rt.t{background:#5faa5a;cursor:default;} .rt.b{background:var(--c,#c97b4c);cursor:default;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
.rt.b.sign{flex-direction:column;gap:2px;} .rt.b.sign .rs-nm{font-family:'Jua',sans-serif;font-size:clamp(8px,1.4vw,14px);color:#fff;background:rgba(0,0,0,.28);padding:1px 6px;border-radius:999px;white-space:nowrap;}
.rt.d{background:#f4e6cf;} .rt.d::after{content:'';position:absolute;inset:0;border:2px dashed rgba(0,0,0,.18);border-radius:6px;}
.rt.w{background:#c9a980;cursor:default;} .rt.f{background:#fbf3e4;} .rt.f:nth-child(odd){background:#f7edd9;}
.rt.k{background:#a86a3f;cursor:default;box-shadow:inset 0 -6px 0 #8c5530;} .rt.k.clerk{font-size:clamp(20px,3.4vw,34px);}
.rt.tb,.rt.np{background:#fbf3e4;cursor:default;}
.rt .spot{position:absolute;inset:8%;border-radius:12px;border:3px dashed #ffb02e;background:rgba(255,214,102,.45);display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;color:#7a4b00;font-size:clamp(11px,1.8vw,16px);}
.rt .spot.next{animation:rpgPulse 1s infinite;border-style:solid;background:rgba(255,214,102,.75);}
.rt .spot.done{border-color:#27ae60;background:rgba(39,174,96,.28);color:#1d6b3f;}
.rt .spot.later{opacity:.55;}
@keyframes rpgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.rpg-p{position:absolute;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,3.6vw,38px);pointer-events:none;transition:left .16s linear,top .16s linear;z-index:3;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));}
.rpg-p.walk{animation:rpgWalk .32s infinite;} .rpg-p.flip{transform:scaleX(-1);}
@keyframes rpgWalk{0%,100%{margin-top:0}50%{margin-top:-6%}}
.rpg-p .say{position:absolute;bottom:92%;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #e2d8c6;border-radius:12px;padding:3px 8px;font-family:'Jua',sans-serif;font-size:clamp(10px,1.5vw,14px);white-space:nowrap;color:#5b4a33;}
.rpg-scene.mini{width:min(100%,calc(var(--cols)*34px));}
.rpg-dlg{width:min(100%,900px);background:#fffdf8;border:5px solid #b9895a;border-radius:20px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);}
.adv-who{display:flex;align-items:center;gap:8px;font-family:'Jua',sans-serif;color:#8a6d3b;font-size:20px;} .adv-who .face{font-size:36px;}
.rpg-bub{font-family:'Jua',sans-serif;font-size:clamp(20px,3vw,32px);line-height:1.4;padding:10px 16px;border-radius:18px;background:#fff;border:3px solid #e2d8c6;color:var(--ink);word-break:keep-all;cursor:pointer;}
.rpg-bub.mine{background:#fff3e3;border-color:var(--st,#ffc27a);}
.rpg-dlg .opts .opt{font-family:'Jua',sans-serif;font-weight:400;}
.rpg-ctrl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.rpg-tip{font-size:15px;color:#7a6a52;background:#fff8e8;border-radius:10px;padding:6px 10px;}
.rpg-learn{font-family:'Jua',sans-serif;font-size:18px;color:#9E2620;background:#FDE8E4;border:2px solid #E25A45;border-radius:12px;padding:6px 12px;text-align:center;animation:pop .4s;}
.rpg-pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:4px;justify-content:center;}
.rpg-pad button{font-size:22px;border-radius:12px;border:3px solid #e2d8c6;background:#fff;color:#8a6d3b;box-shadow:0 3px 0 rgba(0,0,0,.12);}
.rpg-pad button:active{transform:translateY(2px);box-shadow:none;}
.rpg-pad .u{grid-column:2;grid-row:1;} .rpg-pad .l{grid-column:1;grid-row:2;} .rpg-pad .dn{grid-column:2;grid-row:2;} .rpg-pad .rr{grid-column:3;grid-row:2;}
.rpg-clear{text-align:center;font-family:'Jua',sans-serif;background:#fff;border:4px solid #ffd58a;border-radius:20px;padding:16px;max-width:520px;width:100%;}
.rpg-clear h3{margin:0 0 6px;font-size:28px;color:#ff7a18;font-weight:400;} .rpg-clear .st{font-size:34px;margin:4px 0;}
@media (prefers-reduced-motion:reduce){.rt .spot.next,.rpg-p.walk{animation:none;}}

/* ─── 편집 창 ─── */
.modal{position:fixed;inset:0;z-index:60;background:rgba(43,35,32,.5);display:flex;align-items:center;justify-content:center;padding:16px;}
.mbox{background:var(--bg);width:min(1100px,100%);height:min(88vh,860px);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35);}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:2px solid var(--line);flex-wrap:wrap;}
.mhead .t{font-family:'Jua',sans-serif;font-size:22px;margin-right:auto;}
.mbody{flex:1;overflow:auto;padding:14px 16px 30px;}
.et{width:100%;border-collapse:separate;border-spacing:0 6px;}
.et th{font-size:12.5px;color:var(--sub);text-align:left;padding:0 4px;}
.et td{padding:0 3px;vertical-align:top;}
.et input,.et select,.et textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;font-size:15px;}
.et textarea{resize:vertical;min-height:38px;}
.et .x{width:34px;height:34px;border-radius:10px;background:var(--no-soft);color:var(--no);}
.qbox{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;border-left:6px solid var(--gold);}
.qbox .row input,.qbox .row select{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;}
.turn{display:grid;grid-template-columns:1fr 1fr 1.2fr 34px;gap:6px;margin-top:6px;}
.turn input{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;width:100%;}
.sform{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sform .card label{display:block;font-size:13px;color:var(--sub);font-weight:700;margin-top:8px;}
.sform .card input,.sform .card select,.sform .card textarea{width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;}

@media (max-width:900px){
  .hero,.studs,.play,.wsl,.sform{grid-template-columns:1fr;}
  .flow{grid-template-columns:1fr 1fr;}
  .wsopt{position:static;}
  .gopts{grid-template-columns:1fr;}
}
@media print{
  @page{size:A4;margin:10mm;}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .top,.wsopt,.stool,#toast,.noprint{display:none!important;}
  .view{padding:0;max-width:none;}
  #v-ws .wsl{display:block;}
  .papers{gap:0;}
  .paper{box-shadow:none;width:auto;min-height:0;padding:0 2mm;page-break-after:always;max-width:none;}
  .paper:last-child{page-break-after:auto;}
  [contenteditable]:hover,[contenteditable]:focus{box-shadow:none;}
  body.printing main>section:not(#v-ws){display:none!important;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

<body>
<div id="app">
  <header class="top">

    </nav>
    <div class="topr">
      <div class="who" id="who"></div>
      <button class="tbtn" id="sndBtn" title="소리로 읽어 주기">🔊</button>
      <button class="tbtn txt" id="edBtn" title="선생님 편집">✏️ 편집</button>
    </div>
  </header>
  <main>
    <section id="v-home" class="view"></section>
    <section id="v-play" class="view hidden"></section>
    <section id="v-show" class="view hidden"></section>
    <section id="v-turn" class="view hidden"></section>
    <section id="v-ws" class="view hidden"></section>
    <section id="v-game" class="view hidden"></section>
  </main>

function say(t,rate){if(!SOUND)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/\([^)]*\)/g,' ').replace(/[{}]/g,''));
  u.lang='ko-KR';u.rate=rate||.9;const v=speechSynthesis.getVoices().find(v=>/ko/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
let AC=null;
function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
  (ok?[660,880,1100]:[300,220]).forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type=ok?'triangle':'square';
    g.gain.setValueAtTime(.0001,t+k*.1);g.gain.exponentialRampToValueAtTime(ok?.16:.05,t+k*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,t+k*.1+.16);
    o.connect(g).connect(AC.destination);o.start(t+k*.1);o.stop(t+k*.1+.18);});}catch(e){}}

function tick(tk){
  if(!P.active||VIEW!=='play'||tk!==P.loop)return;

    let dx=0,dy=0;const K=P.keys,sp=.42;

  say('뭐라고 말할까요?');

  $('#dBack').onclick=()=>showTurn(t,0);

}
function correct(t,b,spoken){

function gridHTML(text,cls,perRow){
  const ws=text.split(' ');const rows=[];let cur=[];let n=0;
  ws.forEach((w,i)=>{const len=[...w].length+(i<ws.length-1?1:0);if(n+[...w].length>perRow&&cur.length){rows.push(cur);cur=[];n=0;}cur.push([w,i<ws.length-1]);n+=len;});
  if(cur.length)rows.push(cur);
  return `<div class="gboxes">${rows.map((r,ri)=>(ri?'<div class="gbrk"></div>':'')+r.map(([w,sp])=>[...w].map((ch,k)=>`<div class="gb ${typeof cls==='function'?cls(ch,k,w):cls}">${esc(ch)}</div>`).join('')+(sp?'<div class="gb sp"></div>':'')).join('')).join('')}</div>`;
}
function fitGrid(text,perRow){
  const W=Math.min($('#stg').clientWidth-60,1100),n=Math.min(perRow,[...text].length);
  return Math.max(46,Math.min(104,Math.floor(W/n)));
}
function attachInk(wrap){
  const c=document.createElement('canvas');c.className='ink';wrap.appendChild(c);const g=c.getContext('2d');let down=false,lx=0,ly=0;
  const col=stu().color;
  const fit=()=>{const r=wrap.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;c.style.width=r.width+'px';c.style.height=r.height+'px';
    g.setTransform(d,0,0,d,0,0);g.lineCap='round';g.lineJoin='round';g.lineWidth=Math.max(5,Math.min(11,r.width/80));g.strokeStyle=col;};
  fit();
  const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);[lx,ly]=pos(e);g.beginPath();g.arc(lx,ly,g.lineWidth/2,0,7);g.fillStyle=col;g.fill();};
  c.onpointermove=e=>{if(!down)return;const [x,y]=pos(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y;};
  c.onpointerup=c.onpointercancel=()=>down=false;
  return {clear:()=>g.clearRect(0,0,c.width,c.height)};
}

function slowSay(w,btns){[...w].forEach((ch,i)=>setTimeout(()=>{say(ch,.7);if(btns){btns.forEach(b=>b.classList.remove('lit'));btns[i]&&btns[i].classList.add('lit');}},i*800));

    </div>

<script>
/* ═════════ 📝 활동지 ═════════ */
const SEC={
 read:{t:'소리 내어 읽고 ☆에 색칠해요',ins:'한 번 읽을 때마다 ☆ 하나에 색칠해요.'},
 picword:{t:'그림을 보고 알맞은 낱말을 써요',ins:'그림을 보고 칸에 맞게 써요.'},
 traceword:{t:'낱말을 따라 써요',ins:'회색 글자를 따라 쓰고, 빈칸에 한 번 더 써요.'},
 tracesent:{t:'문장을 따라 써요',ins:'띄어 쓰는 곳(색칠된 칸)에 주의해요.'},
 choose:{t:'이럴 때 알맞은 말에 ○표 해요',ins:'중국집에서 바르게 말한 것을 골라요.'},
 dialog:{t:'대화의 빈칸에 알맞은 말을 써요',ins:'아래 낱말 상자에서 골라 써요.'},
 order:{t:'중국집에서 하는 일을 차례대로 번호를 써요',ins:'먼저 하는 일부터 ①, ②, ③ … 순서로 써요.'},
 circle:{t:'같은 글자를 찾아 ○ 해요',ins:'왼쪽 글자를 소리 내어 읽고, 오른쪽에서 같은 글자를 모두 찾아요.'},
 match:{t:'그림과 낱말을 선으로 이어요',ins:'낱말을 소리 내어 읽고, 알맞은 그림과 이어요.'},
 sitwrite:{t:'이럴 때 할 말을 문장으로 써요',ins:'상황에 알맞은 말을 칸에 맞게 써요. 색칠된 칸은 띄어 쓰는 곳이에요.'},
 spell:{t:'바르게 쓴 문장에 ○ 하고 바르게 써요',ins:'둘 중 하나는 소리 나는 대로 썼거나 틀리게 쓴 문장이에요.'},
 self:{t:'스스로 평가해요',ins:'알맞은 얼굴에 ○표 해요.'},
 free:{t:'자유롭게 써요',ins:'선생님이 내용을 고쳐 쓰세요.'},
};
const SEC_DEF={speak:['choose','sitwrite','spell','dialog','self'],hangul:['circle','match','traceword','tracesent','self']};
function wsCfg(sid){const s=stu(sid);const c=DATA.ws[sid]||(DATA.ws[sid]={lv:s.level,secs:SEC_DEF[s.focus].slice(),title:`🥡 ${DATA.lesson.title} — 활동지`});return c;}
let WSWHO=null;
const boxes=(w,mode,sm)=>`<div class="wb ${sm?'sm':''}">${[...w].map((ch,k)=>ch===' '?'<span class="sp"></span>':`<span class="${mode==='g'||(mode==='f'&&k===0)?'':'e0'}">${esc(ch)}</span>`).join('')}</div>`;
function secBody(type,sid,lv){
  const s=stu(sid),W=shuffle(byLv(DATA.words,lv)),S=shuffle(byLv(DATA.sents,lv));
  const ed=t=>`<span contenteditable="true">${esc(t)}</span>`;
  if(type==='read')return `<div class="rd">${W.slice(0,6).map(w=>`<div><span class="pe">${w.e}</span> ${ed(w.w)}<small>☆☆☆</small></div>`).join('')}</div>`;
  if(type==='picword')return `<div class="wrow">${W.slice(0,4).map(w=>`<div class="witem"><span class="pe">${w.e}</span>${boxes(w.w,lv===1?'g':lv===2?'f':'e')}</div>`).join('')}</div>`;
  if(type==='traceword')return W.slice(0,3).map(w=>`<div class="wline"><span class="q pe">${w.e}</span>${boxes(w.w,'g')}${boxes(w.w,'g')}${boxes(w.w,'e')}</div>`).join('');
  if(type==='tracesent')return S.slice(0,2).map(x=>`<div class="wline" style="flex-direction:column;align-items:flex-start;gap:2px"><div><span class="pe">${x.e}</span> <b contenteditable="true">${esc(x.sit)}</b></div>${boxes(x.t,lv===3?'e':'g',true)}${boxes(x.t,'e',true)}</div>`).join('');
  if(type==='choose')return S.slice(0,3).map((x,i)=>{const o=shuffle([x.t,(x.wrong||['…'])[0]]);
    return `<div class="wline"><span class="q pe">${x.e}</span><b style="min-width:200px">${i+1}. ${ed(x.sit)}</b><div class="choice">${o.map(t=>`<span contenteditable="true">${esc(t)}</span>`).join('')}</div></div>`;}).join('');
  if(type==='dialog'){const T=[];DATA.quests.forEach(q=>q.turns.forEach(t=>T.push(t)));const pick=T.slice(0,1).concat(shuffle(T.slice(1)).slice(0,2));
    const m0=DATA.menu[0]||{n:'짜장면',p:'육천'},sw=x=>String(x).replace(/\{음식\}/g,m0.n).replace(/\{가격\}/g,m0.p);
    return `<div class="dlgw">${pick.map(t=>`<div class="l"><span class="wh">🧑‍🍳 점원</span>${ed(sw(t.npc))}</div><div class="l"><span class="wh">${s.ic} 나</span><span class="blank"></span></div>`).join('')}</div>
      <div class="bank">${shuffle(pick.map(t=>sw(t.ok))).map(t=>`<span contenteditable="true">${esc(t)}</span>`).join('')}</div>`;}
  if(type==='order')return `<div class="ordr">${shuffle(DATA.order).map(([e,t])=>`<div><span class="pe">${e}</span><span contenteditable="true">${esc(t)}</span><br><span class="bx"></span></div>`).join('')}</div>`;
  if(type==='self'){const L=s.focus==='speak'?['상황에 알맞은 말을 골라 말할 수 있어요.','"주세요", "감사합니다"처럼 높임 말로 바르게 말했어요.','내가 할 말을 맞춤법과 띄어쓰기에 맞게 썼어요.','친구의 말을 끝까지 듣고 내 차례에 말했어요.']
      :lv===1?['받침 없는 글자를 소리 내어 읽을 수 있어요.','그림을 보고 알맞은 낱말을 찾을 수 있어요.','낱말과 짧은 말을 칸에 맞게 따라 쓸 수 있어요.','친구와 차례를 지켜 말했어요.']
      :['중국집 낱말을 소리 내어 읽을 수 있어요.','낱말을 칸에 맞게 바르게 쓸 수 있어요.','문장을 띄어 쓰는 곳에 주의하며 따라 쓸 수 있어요.','소리와 글자가 다른 낱말을 알아요.'];
    return `<table class="self">${L.map(t=>`<tr><td contenteditable="true">${esc(t)}</td><td class="f">😊 😐 😥</td></tr>`).join('')}</table>
      <div style="margin-top:6px;font-size:14px"><b>선생님 한마디</b><div class="tline" contenteditable="true"></div></div>`;}
  if(type==='circle'){
    const open=ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172&&c%28===0;};
    const mk=(cho,jung)=>String.fromCharCode(0xAC00+cho*588+jung*28);
    const CH=[0,2,3,5,6,7,9,11,12,14,15,16,17,18],JU=[0,4,8,13,18,20,1,5];
    const seen=new Set(),T=[];W.forEach(w=>{const ch=shuffle([...w.w].filter(c=>open(c)&&!seen.has(c)))[0];if(ch&&T.length<4){seen.add(ch);T.push({ch,w});}});
    return T.map(({ch,w})=>{const c=ch.charCodeAt(0)-0xAC00,cho=Math.floor(c/588),ju=Math.floor((c%588)/28);
      const d=new Set();shuffle(JU.filter(x=>x!==ju)).slice(0,2).forEach(j=>d.add(mk(cho,j)));shuffle(CH.filter(x=>x!==cho)).slice(0,3).forEach(k=>d.add(mk(k,ju)));
      const cells=shuffle([ch,ch,ch,...[...d].slice(0,4)]);
      return `<div class="circ"><div class="tg"><span class="pe">${w.e}</span><b>${esc(ch)}</b><small>${esc(w.w)}</small></div><div class="cs">${cells.map(x=>`<i>${esc(x)}</i>`).join('')}</div></div>`;}).join('');}
  if(type==='match'){const L=W.slice(0,4),R=shuffle(L);
    return `<div class="mt">${L.map((w,i)=>`<div class="ml"><span class="pe">${w.e}</span><i class="dot"></i></div><div></div><div class="mr"><i class="dot"></i><b>${esc(R[i].w)}</b></div>`).join('')}</div>`;}
  if(type==='sitwrite'){const U=[],fw=new Set();S.forEach(x=>{const k=x.t.split(' ')[0];if(!fw.has(k)&&U.length<3){fw.add(k);U.push(x);}});S.forEach(x=>{if(U.length<3&&!U.includes(x))U.push(x);});
    return U.map((x,i)=>`<div class="sw"><div><span class="pe">${x.e}</span> <b>${i+1}. ${ed(x.sit)}</b></div>
      ${lv<3?`<div class="bank" style="margin:4px 0">${shuffle(x.t.replace(/[.?!]/g,'').split(' ')).map(t=>`<span contenteditable="true">${esc(t)}</span>`).join('')}</div>`:''}${boxes(x.t,'e',true)}</div>`).join('');}
  if(type==='spell'){let P=S.filter(x=>x.miss||x.snd);if(P.length<3)P=P.concat(shuffle(DATA.sents.filter(x=>(x.miss||x.snd)&&!P.includes(x))).slice(0,3-P.length));
    return P.slice(0,3).map((x,i)=>{const o=shuffle([x.t,x.miss||x.snd]);
      return `<div class="sw"><div class="wline" style="margin:0"><span class="q pe">${x.e}</span><b>${i+1}.</b><div class="choice">${o.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>${boxes(x.t,'e',true)}</div>`;}).join('');}
  if(type==='free')return `<div class="free" contenteditable="true">여기에 내용을 쓰세요.</div><div class="tline"></div><div class="tline"></div>`;
  return '';
}
function secHTML(type,sid,lv,no){
  return `<div class="sec" data-type="${type}"><div class="stool"><button data-a="up" title="위로">↑</button><button data-a="dn" title="아래로">↓</button><button data-a="re" title="문제 다시 뽑기">🔀</button><button data-a="x" title="지우기">✕</button></div>
    <h3><span class="no">${no}</span><span contenteditable="true">${esc(SEC[type].t)}</span></h3><div class="ins" contenteditable="true">${esc(SEC[type].ins)}</div>
    <div class="sb">${secBody(type,sid,lv)}</div></div>`;
}
function pageHTML(sid){
  const s=stu(sid),c=wsCfg(sid),d=new Date();
  return `<div class="paper" data-sid="${sid}"><div class="ph"><h1 contenteditable="true">${esc(c.title)}</h1>
    <div class="nm">${d.getMonth()+1}월 ${d.getDate()}일 · 이름 <span contenteditable="true">${esc(s.name)}</span></div></div>
    <div class="pg"><b>🎯 나의 목표</b> <span contenteditable="true">${esc(s.goal)}</span></div>
    ${c.secs.map((t,i)=>secHTML(t,sid,c.lv,i+1)).join('')}</div>`;
}
function renderWS(){
  if(!WSWHO)WSWHO=CUR;
  const who=WSWHO==='all'?DATA.students.map(s=>s.id):[WSWHO];const one=WSWHO!=='all'?wsCfg(WSWHO):null;
  $('#v-ws').innerHTML=`<div class="wsl"><aside class="card wsopt">
    <div class="h3">📝 활동지 만들기</div>
    <h4>누구의 활동지?</h4><select id="wWho">${DATA.students.map(s=>`<option value="${s.id}" ${WSWHO===s.id?'selected':''}>${s.ic} ${esc(s.name)} (${FOCUS[s.focus]})</option>`).join('')}<option value="all" ${WSWHO==='all'?'selected':''}>👥 모두 (한 장씩)</option></select>
    ${one?`<h4>단계</h4><select id="wLv">${[1,2,3].map(n=>`<option value="${n}" ${one.lv===n?'selected':''}>${n}단계</option>`).join('')}</select>
    <h4>넣을 활동 (순서대로 들어가요)</h4>${Object.keys(SEC).map(k=>`<label class="ck"><input type="checkbox" data-k="${k}" ${one.secs.includes(k)?'checked':''}> ${SEC[k].t}</label>`).join('')}`:'<p class="sub" style="margin-top:8px">학생마다 고른 설정으로 한 장씩 만들어요. 설정은 학생을 하나씩 골라 바꿔요.</p>'}
    <h4>고치기</h4><p class="sub">글자는 눌러서 바로 고쳐요. 그림(이모지)을 누르면 바꿀 수 있어요. 각 칸 오른쪽 위 단추로 순서를 바꾸거나(↑↓) 문제를 다시 뽑거나(🔀) 지울(✕) 수 있어요. 고친 내용은 자동 저장돼요.</p>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="wPrint">🖨️ 인쇄하기</button><button class="btn" id="wNew">🔀 새로 만들기</button></div>
    <div class="row" style="margin-top:8px"><button class="btn sm jade" onclick="go('game')">다음: 마무리 게임 ▶</button></div>
  </aside><div class="papers" id="papers">${who.map(id=>DATA.wsHTML[id]||pageHTML(id)).join('')}</div></div>`;
  $('#wWho').onchange=e=>{WSWHO=e.target.value;renderWS();};
  if(one){
    $('#wLv').onchange=e=>{one.lv=+e.target.value;delete DATA.wsHTML[WSWHO];persist();renderWS();};
    $('#v-ws').querySelectorAll('.wsopt input[data-k]').forEach(c=>c.onchange=()=>{
      one.secs=[...$('#v-ws').querySelectorAll('.wsopt input[data-k]:checked')].map(x=>x.dataset.k);delete DATA.wsHTML[WSWHO];persist();renderWS();});
  }
  $('#wNew').onclick=()=>{if(!confirm('고친 내용을 지우고 문제를 새로 뽑을까요?'))return;who.forEach(id=>delete DATA.wsHTML[id]);persist();renderWS();};
  $('#wPrint').onclick=()=>{document.body.classList.add('printing');setTimeout(()=>{window.print();},50);};
  const pp=$('#papers');let t=null;
  const save=()=>{clearTimeout(t);t=setTimeout(()=>{pp.querySelectorAll('.paper').forEach(p=>{renum(p);DATA.wsHTML[p.dataset.sid]=p.outerHTML;});persist();},400);};
  pp.addEventListener('input',save);
  pp.addEventListener('click',e=>{
    const pe=e.target.closest('.pe');
    if(pe){const v=prompt('바꿀 그림(이모지)을 넣어 주세요.',pe.textContent.trim());if(v!=null&&v.trim()){pe.textContent=v.trim();save();}return;}
    const b=e.target.closest('.stool button');if(!b)return;

    if(a==='x'){sec.remove();}
    else if(a==='up'&&sec.previousElementSibling&&sec.previousElementSibling.classList.contains('sec'))sec.parentNode.insertBefore(sec,sec.previousElementSibling);
    else if(a==='dn'&&sec.nextElementSibling)sec.parentNode.insertBefore(sec.nextElementSibling,sec);
    else if(a==='re')sec.querySelector('.sb').innerHTML=secBody(sec.dataset.type,sid,wsCfg(sid).lv);
    save();
  });
}
function renum(p){p.querySelectorAll('.sec .no').forEach((n,i)=>n.textContent=i+1);}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));

/* ═════════ 🏆 마무리 게임: 주문 왕 ═════════ */
const G={on:false,players:[],n:8,i:0,score:{},tray:{},log:[],mode:{},cnt:{},q:null,lock:false,pick:null};

      <span class="chip">${s.level}단계</span></div>`).join('')}
    <div class="row" style="justify-content:center;margin:12px 0"><span class="j">문제 수</span>${[6,8,10].map(n=>`<label class="row"><input type="radio" name="gn" value="${n}" ${G.n===n?'checked':''}> ${n}개</label>`).join('')}</div>
    <button class="btn pri" id="gStart" style="font-size:22px;padding:12px 30px">▶ 게임 시작</button></div>`;
  gBindTabs();

function gNext(){
  if(G.i>=G.n){G.on=false;G.end=true;G.players.forEach(p=>{const r=REC[p]=REC[p]||{};r.game={score:G.score[p],total:G.log.filter(l=>l.p===p).length,log:G.log.filter(l=>l.p===p).map(l=>({a:String(l.ans),ok:!!l.ok})),at:Date.now()};});saveRec();gEnd();return;}
  const p=G.players[G.i%G.players.length],s=stu(p);let mode=G.mode[p];CUR=p;renderWho();
  if(mode==='mix'){G.cnt[p]=(G.cnt[p]||0)+1;mode=G.cnt[p]%2?s.focus:'say';}
  if(mode==='say'){const it=shuffle(byLv(DATA.sents,s.level))[0];G.q={p,mode,it,ans:it.t,opts:[],dish:(shuffle(DATA.menu)[0]||{e:'🍽️'}).e,show:+s.level===1};}
  else if(mode==='speak'){const it=shuffle(byLv(DATA.sents,s.level))[0];
    const wr=(it.wrong||[]).slice(0,2);while(wr.length<2){const o=shuffle(DATA.sents).find(x=>x.t!==it.t&&!wr.includes(x.t));wr.push(o?o.t:'…');}
    G.q={p,mode,it,ans:it.t,opts:shuffle([it.t].concat(wr)),dish:(shuffle(DATA.menu)[0]||{e:'🍽️'}).e};}
  else{const L=byLv(DATA.words,s.level),it=shuffle(L)[0];const pool=shuffle(DATA.words.filter(w=>w.w!==it.w));const ds=[];
    if(it.snd)ds.push(it.snd);pool.forEach(w=>{if(ds.length<2&&!ds.includes(w.w))ds.push(w.w);});
    G.q={p,mode,it,ans:it.w,opts:shuffle([it.w].concat(ds.slice(0,2))),dish:it.e};}
  G.lock=false;gRound();
  setTimeout(()=>say(G.q.mode==='say'?(G.q.show?G.q.it.sit+'. 듣고 따라 말해요. '+G.q.it.t:G.q.it.sit+'. 직접 말해 볼까요?'):G.q.mode==='speak'?G.q.it.sit+'. 뭐라고 말할까요?':G.q.it.w),250);
}

function gRound(){

        :`<div class="order enter"><span class="sit">${q.it.e}</span><button class="btn gold" id="gHear" style="font-size:24px">🔊 다시 듣기</button></div>`}
      <div class="gopts" id="gOpts" style="pointer-events:none">${q.opts.map((o,i)=>`<button class="opt drop" style="--k:${i+(q.mode==='speak'?3:1)}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sm" id="gQuit">그만하기</button></div></div></div>`;
  if($('#gHear'))$('#gHear').onclick=()=>say(q.it.w);
  {const gq=G.i;setTimeout(()=>{const o=$('#gOpts');if(o&&G.i===gq)o.style.pointerEvents='';},(q.opts.length+(q.mode==='speak'?3:1))*550+300);}
  $('#gQuit').onclick=()=>{G.on=false;G.end=false;renderGame();};
  $('#v-game').querySelectorAll('.gopts .opt').forEach(b=>b.onclick=()=>{
    if(G.lock)return;G.lock=true;const ok=b.dataset.v===q.ans;
    if(ok){b.classList.remove('drop');b.classList.add('ok','pop');beep(true);G.score[q.p]++;G.tray[q.p].push(q.dish);say('딩동댕! '+q.ans);}

    G.log.push({p:q.p,ans:q.ans,ok});G.i++;
    const tr=$('#v-game').querySelector('.tray.on .dish');if(tr&&ok)tr.innerHTML=G.tray[q.p].join('');
    setTimeout(gNext,1600);
  });
}

    $('#cRec').onclick=()=>{if(confirm('말하기·읽기·쓰기·놀이·게임 기록을 모두 지울까요?')){REC={};saveRec();toast('기록을 지웠어요');}};
    $('#cWs').onclick=()=>{if(confirm('활동지에서 고친 내용을 지울까요?')){DATA.wsHTML={};DATA.ws={};persist();toast('활동지를 처음대로 되돌렸어요');}};
    $('#cAll').onclick=()=>{if(confirm('학생, 낱말, 문장, 미션, 물건 배치, 활동지 편집을 모두 처음대로 되돌릴까요?')){DATA=clone(DEF);CUR=DATA.students[0].id;persist();renderWho();toast('모두 처음대로 되돌렸어요');}};
  }
}

/* ═════════ 🔄 말 차례 놀이 ═════════ */
const TG={on:false,end:false,role:{s:null,g:null},len:'short',i:0,seq:[],food:null,tries:0,state:'say',hint:0,log:[]};
const ROLE={s:{ic:'🧑‍🍳',n:'점원'},g:{ic:'🙋',n:'손님'}};
const isOpenCh=ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172&&c%28===0;};
const hlOpen=t=>[...t].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;if(c<0||c>=11172)return esc(ch);return isOpenCh(ch)?`<span class="o">${esc(ch)}</span>`:`<span class="x">${esc(ch)}</span>`;}).join('');
function tgWho(r){const id=TG.role[r];return id==='npc'?null:stu(id);}
function tgName(r){const s=tgWho(r);return s?s.name:'컴퓨터';}
function tgIc(r){const s=tgWho(r);return s?s.ic:'🤖';}
function tgLine(k){const L=TG.seq[k];const s=tgWho(L.r);const lv=s?+s.level:3;
  const f=TG.food||{n:'짜장면',p:'육천'};const sw=x=>String(x).replace(/\{음식\}/g,f.n).replace(/\{가격\}/g,f.p);
  return {r:L.r,lv,full:sw(L.t),said:sw(lv===1&&L.easy?L.easy:L.t),sit:L.sit,wrong:(L.wrong||[]).map(sw)};}
function renderTurn(){
  if(TG.on){tgRound();return;}
  if(TG.end){tgEnd();return;}
  const S=DATA.students;
  if(S.length===1&&!TG.role.s){TG.role.s='npc';TG.role.g=S[0].id;}
  const LO=[...S].sort((a,b)=>a.level-b.level);
  if(!TG.role.g||(TG.role.g!=='npc'&&!S.find(x=>x.id===TG.role.g)))TG.role.g=LO[0]?LO[0].id:'npc';
  if(!TG.role.s||(TG.role.s!=='npc'&&!S.find(x=>x.id===TG.role.s)))TG.role.s=LO[1]?LO[1].id:'npc';
  if(TG.role.s===TG.role.g)TG.role.g='npc';
  const opt=r=>S.map(x=>`<option value="${x.id}" ${TG.role[r]===x.id?'selected':''}>${x.ic} ${esc(x.name)} (${x.level}단계)</option>`).join('')+`<option value="npc" ${TG.role[r]==='npc'?'selected':''}>🤖 컴퓨터가 할게요</option>`;
  const nAll=DATA.talk.length,nShort=DATA.talk.filter(x=>!x.opt).length;
  $('#v-turn').innerHTML=`<div class="card tg-set">
    <div class="tg-hero"><span>🧑‍🍳</span><span class="sw">🔄</span><span>🙋</span></div>
    <div class="h2" style="justify-content:center">말 차례 놀이</div>
    <p class="sub" style="font-size:16px;text-align:center;margin:4px 0 14px">점원과 손님이 되어 한 번씩 차례대로 말을 주고받아요.<br>내 차례가 아닐 때는 친구의 말을 끝까지 들어요.</p>
    <div class="tg-roles">${['s','g'].map(r=>`<label class="tg-role"><span class="ri">${ROLE[r].ic}</span><span class="j" style="font-size:20px">${ROLE[r].n}</span><select data-r="${r}">${opt(r)}</select></label>`).join('<button class="btn sm" id="tgSwap" title="역할 바꾸기">⇄ 바꾸기</button>')}</div>
    <div class="row" style="justify-content:center;margin:14px 0"><span class="j">길이</span>
      <label class="row"><input type="radio" name="tgl" value="short" ${TG.len==='short'?'checked':''}> 짧게 (${nShort}번)</label>
      <label class="row"><input type="radio" name="tgl" value="long" ${TG.len==='long'?'checked':''}> 길게 (${nAll}번, 부탁하기 포함)</label></div>
    <div class="tg-help sub">1단계 학생은 🔊 말을 듣고 <b>따라 말해요</b> (받침 없는 글자는 진하게 보여요).<br>2단계 학생은 알맞은 말을 <b>골라서</b> 말해요. 3단계 학생은 <b>스스로</b> 말해요.</div>
    <div style="text-align:center;margin-top:14px"><button class="btn pri" id="tgStart" style="font-size:22px;padding:12px 30px">▶ 놀이 시작</button></div></div>`;
  $('#v-turn').querySelectorAll('select[data-r]').forEach(x=>x.onchange=()=>{const r=x.dataset.r,o=r==='s'?'g':'s';TG.role[r]=x.value;if(x.value!=='npc'&&TG.role[o]===x.value)TG.role[o]='npc';renderTurn();});
  $('#tgSwap').onclick=()=>{TG.role={s:TG.role.g,g:TG.role.s};renderTurn();};
  $('#v-turn').querySelectorAll('input[name=tgl]').forEach(x=>x.onchange=()=>TG.len=x.value);
  $('#tgStart').onclick=()=>{
    if(TG.role.s==='npc'&&TG.role.g==='npc'){toast('한 명은 학생이 맡아 주세요.');return;}
    TG.seq=DATA.talk.filter(x=>TG.len==='long'||!x.opt);
    const gs=tgWho('g');TG.food=(gs&&+gs.level===1)?(DATA.menu.find(m=>m.n==='마파두부')||{n:'마파두부',p:'팔천'}):(DATA.menu[0]||{n:'짜장면',p:'육천'});
    TG.on=true;TG.end=false;TG.i=0;TG.log=[];tgStartTurn();};
}
function tgStartTurn(){TG.tries=0;TG.hint=0;TG.state='say';const L=tgLine(TG.i);TG.state=L.lv===2&&tgWho(L.r)?'pick':'say';tgRound(true);}
function tgRound(fresh){
  const L=tgLine(TG.i),me=L.r,other=me==='s'?'g':'s',s=tgWho(me),npc=!s;
  const prev=TG.i>0?tgLine(TG.i-1):null,col=s?s.color:'#7A6A5E',ocol=(tgWho(other)||{color:'#7A6A5E'}).color;
  let body='';
  if(npc){body=`<div class="tg-bub">${esc(L.full)}</div><p class="sub" style="text-align:center">🤖 컴퓨터가 말했어요. 잘 들었으면 차례를 넘겨요.</p>
     <div class="row" style="justify-content:center"><button class="btn" id="tgHear">🔊 다시 듣기</button><button class="btn pri" id="tgNpcNext">👂 다 들었어요</button></div>`;}
  else if(L.lv===1){body=`<div class="tg-ask">🔊 듣고 따라 말해요</div><div class="tg-bub tg-open">${hlOpen(L.said)}</div><div class="sub" style="text-align:center">진한 글자는 받침 없는 글자예요. 읽을 수 있는 글자를 짚어 봐요!</div>
     <div class="row" style="justify-content:center"><button class="btn gold" id="tgHear" style="font-size:20px">🔊 들어 보기</button></div>`;}
  else if(L.lv===2&&TG.state==='pick'){const o=shuffle([L.said].concat(L.wrong.slice(0,2)));
     body=`<div class="tg-ask">💬 무슨 말을 할까요? 골라서 말해요</div><div class="opts tg-opts">${o.map(t=>`<button class="opt" data-ok="${t===L.said?1:0}">${esc(t)}</button>`).join('')}</div>`;}
  else if(L.lv>=3&&TG.hint<2){const w=L.said.split(' ');
     body=`<div class="tg-ask">🗣️ 스스로 말해요</div><div class="tg-bub">${TG.hint===1?esc(w[0])+' …':'❓'}</div>
     <div class="row" style="justify-content:center"><button class="btn sm" id="tgHint">💡 힌트</button><button class="btn sm" id="tgShow">👀 보기</button></div>`;}
  else{body=`<div class="tg-ask">✅ 이렇게 말해요</div><div class="tg-bub">${esc(L.said)}</div>
     <div class="row" style="justify-content:center"><button class="btn sm" id="tgHear">🔊 들어 보기</button></div>`;}
  const marks=!npc&&!(L.lv===2&&TG.state==='pick');
  $('#v-turn').innerHTML=`<div class="tg-play">
    <div class="tg-top"><span class="kick"><b style="background:#2B2320">${TG.i+1} / ${TG.seq.length}</b> 🔄 말 차례 놀이 · ${esc(TG.food.n)} 가게</span>
      <span class="row" style="margin-left:auto"><button class="btn sm" id="tgQuit">그만하기</button></span></div>
    <div class="tg-sides">
      <div class="tg-side on" style="--st:${col}"><div class="ava">${tgIc(me)}</div><div><div class="j nm">🎤 ${esc(tgName(me))} 차례</div><div class="rl">${ROLE[me].ic} ${ROLE[me].n}</div></div></div>
      <div class="tg-arrow" aria-hidden="true">⇄</div>
      <div class="tg-side" style="--st:${ocol}"><div class="ava">${tgIc(other)}</div><div><div class="j nm">👂 ${esc(tgName(other))}</div><div class="rl">${ROLE[other].ic} ${ROLE[other].n} · 잘 들어요</div></div></div>
    </div>
    <div class="card tg-main ${fresh?'enter':''}" style="--st:${col};border-top:8px solid ${col}">
      ${prev?`<div class="tg-prev"><span class="ava">${tgIc(prev.r)}</span><div><small>${esc(tgName(prev.r))} (${ROLE[prev.r].n})</small>${esc(prev.said)}</div></div>`:''}
      <div class="tg-sit">📍 ${esc(L.sit)}</div>${body}
      ${marks?`<div class="recb tg-mark"><button class="a" data-r="a">✅ 혼자 말했어요</button><button class="b" data-r="b">🤝 도움 받아 말했어요</button></div>`:''}
    </div></div>`;
  const v=$('#v-turn');
  if(fresh){if(npc||L.lv===1)setTimeout(()=>say(L.said),450);}
  if($('#tgHear'))$('#tgHear').onclick=()=>say(L.lv===1&&!npc?L.said:L.said,L.lv===1?.75:.9);
  if($('#tgNpcNext'))$('#tgNpcNext').onclick=()=>tgNext(null);
  if($('#tgHint'))$('#tgHint').onclick=()=>{TG.hint=1;TG.tries=Math.max(TG.tries,1);tgRound();};
  if($('#tgShow'))$('#tgShow').onclick=()=>{TG.hint=2;TG.tries=Math.max(TG.tries,1);say(L.said);tgRound();};
  $('#tgQuit').onclick=()=>{TG.on=false;TG.end=false;try{speechSynthesis.cancel();}catch(e){}renderTurn();};
  v.querySelectorAll('.tg-opts .opt').forEach(b=>b.onclick=()=>{
    if(b.dataset.ok==='1'){b.classList.add('ok','pop');beep(true);say(L.said);v.querySelectorAll('.tg-opts .opt').forEach(x=>x.disabled=true);setTimeout(()=>{TG.state='say';tgRound();},900);}
    else{TG.tries++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('no','shake');beep(false);
      if(TG.tries>=2){const ok=v.querySelector('.tg-opts .opt[data-ok="1"]');if(ok)ok.classList.add('hint');}say('다시 생각해 볼까요?');}});
  v.querySelectorAll('.tg-mark button').forEach(b=>b.onclick=()=>tgNext(b.dataset.r));
}
function tgNext(r){
  const L=tgLine(TG.i),s=tgWho(L.r);
  if(s&&r){rec(s.id,'turn',`${ROLE[L.r].ic} ${L.said}`,r);TG.log.push({p:s.id,r});if(r==='a')beep(true);}
  TG.i++;
  if(TG.i>=TG.seq.length){TG.on=false;TG.end=true;tgEnd();return;}
  const n=tgLine(TG.i);
  const ov=document.createElement('div');ov.className='tg-swap';ov.innerHTML=`<div><span>🔄</span>이제 <b>${esc(tgName(n.r))}</b> 차례!</div>`;
  $('#v-turn').appendChild(ov);say(tgName(n.r)+' 차례예요');
  setTimeout(()=>{ov.remove();if(VIEW==='turn'&&TG.on)tgStartTurn();},1300);
}
function tgEnd(){
  const ids=['s','g'].map(r=>TG.role[r]).filter(x=>x!=='npc');
  $('#v-turn').innerHTML=`<div class="card res" style="max-width:760px;margin:0 auto"><div class="trophy">🎉</div>
    <div class="h2" style="justify-content:center">끝까지 차례를 지켜 말했어요!</div>
    <div class="gplay" style="margin:16px 0">${ids.map(id=>{const x=stu(id),L=TG.log.filter(l=>l.p===id),a=L.filter(l=>l.r==='a').length;
      return `<div class="tray" style="--st:${x.color}"><span class="nm">${x.ic} ${esc(x.name)}</span><div class="dish">${'⭐'.repeat(a)||'🙂'}</div><span class="sc" style="font-size:18px">혼자 ${a} · 도움 ${L.length-a}</span></div>`;}).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn pri" id="tgAgain">⇄ 역할 바꿔서 한 번 더</button><button class="btn" id="tgSet">처음 화면</button><button class="btn sm jade" onclick="go('ws')">다음: 활동지 ▶</button></div></div>`;
  say('끝까지 차례를 잘 지켰어요!');
  $('#tgAgain').onclick=()=>{TG.role={s:TG.role.g,g:TG.role.s};TG.end=false;renderTurn();$('#tgStart').click();};
  $('#tgSet').onclick=()=>{TG.end=false;renderTurn();};

function advSpots(){const S=advShop(),used=new Set(),fall=[[3,5],[6,5],[7,2],[1,6],[8,6],[1,2]];

      if(ch==='#'){cls+='t';inner='🌳';}else if(ch==='='){cls+='r';}else if(ch==='~'){cls+='g';inner='🌼';}else if(ch==='F'){cls+='t';inner='⛲';}
      else if(ch==='H'){cls+='g';inner='🏠';}else if(ch==='.'){cls+='g';}
      else if(ADV_BODY[ch]!==undefined){const B=ADV_SHOPS[ADV_BODY[ch]],sg=ADV_SIGN[ch];cls+='b';
        if(sg&&sg[0]===x&&sg[1]===y){cls+=' sign';inner=`${B.ico}<span class="rs-nm">${B.name}${ADV.cleared&&ADV.cleared[ADV_BODY[ch]]?' 🏆':''}</span>`;}
        return `<div class="${cls}" style="--c:${B.color}" data-x="${x}" data-y="${y}">${inner}</div>`;}
      else if(ADV_DOORS[ch]!==undefined){cls+='d';inner='🚪';}
    }else{
      if(ch==='#')cls+='w';else if(ch==='K'){cls+='k';if(x===4&&y===1){cls+=' clerk';inner='🧑‍🍳';}}
      else if(ch==='T'){cls+='tb';inner='🪑';}else if(ch==='n'){cls+='np';inner='🧒';}else if(ch==='x'){cls+='f';inner='🚪';}else cls+='f';
      const si=spots.findIndex(p=>p[0]===x&&p[1]===y);
      if(si>=0){const state=ADV.done[si]?'done':(si===next?'next':'later');inner+=`<span class="spot ${state}">${ADV.done[si]?'✅':(si===next?'✨':'①②③④⑤⑥⑦'[si])}</span>`;}
    }
    return `<div class="${cls}" data-x="${x}" data-y="${y}">${inner}</div>`;};
  const quest=ADV.view==='town'?`🥡 중국집에서 배운 말로 <b>☕ 카페</b>와 <b>🍔 햄버거 가게</b>에서도 말해 봐요! 🚪 문으로 들어가요.`
    :ADV.dlg?`${S.ico} ${S.name} · <b>💬 ${ADV.dlg.sc.title}</b> 하는 중`:(next<0?`🏆 ${S.name} 모험 끝! 🚪 문으로 나가면 마을이에요`:`${S.ico} ${S.name} · ${next+1}/${S.scenes.length} <b>✨ ${S.scenes[next].title}</b> 자리로 가요`);
  host.innerHTML=`<div class="rpg-wrap">
    <div class="rpg-hud"><div class="rpg-turn" style="--st:${me.color}">${me.ic} <b>${esc(me.name)}</b> 차례</div><div class="rpg-quest">${quest}</div><div class="rpg-coin">💰 ${ADV.coins}</div>
      ${ADV.view==='shop'?`<button class="rpg-tg" id="advOut">🏘️ 마을로</button>`:''}</div>
    <div class="rpg-scene ${ADV.dlg||ADV.clear?'mini':''}" style="--cols:${cols};--rows:${rows}">
      <div class="rpg-map" id="advMap">${m.map((r,y)=>[...r].map((ch,x)=>tile(ch,x,y)).join('')).join('')}
      <div class="rpg-p ${ADV.face<0?'flip':''}" id="advP" style="left:${ADV.x/cols*100}%;top:${ADV.y/rows*100}%;width:${100/cols}%;height:${100/rows}%">${me.ic}${ADV.say?`<span class="say">${ADV.say}</span>`:''}</div></div>
    </div>
    ${ADV.dlg?advDlgHTML():''}${ADV.clear?advClearHTML():''}
    ${ADV.dlg||ADV.clear?'':`<div class="rpg-pad"><button class="u" data-mv="0,-1" aria-label="위로">▲</button><button class="l" data-mv="-1,0" aria-label="왼쪽">◀</button><button class="dn" data-mv="0,1" aria-label="아래로">▼</button><button class="rr" data-mv="1,0" aria-label="오른쪽">▶</button></div>
    <div class="sub" style="text-align:center">👆 가고 싶은 칸을 누르거나 화살표로 걸어요. ${ADV.view==='town'?'🚪 문에 서면 가게로 들어가요.':'✨ 자리에 서면 대화가 시작돼요.'}</div>`}
  </div>`;
  host.querySelectorAll('.rpg-map .rt').forEach(t=>t.onclick=()=>advTapTo(+t.dataset.x,+t.dataset.y));
  host.querySelectorAll('.rpg-pad button').forEach(b=>b.onclick=()=>{const [dx,dy]=b.dataset.mv.split(',').map(Number);clearInterval(ADV.timer);advMove(dx,dy);});
  if($('#advOut'))$('#advOut').onclick=()=>advLeave(true);
  advBindDlg(host);
}
function advRender(){const h=$('#advHost');if(h)renderAdv(h);}
function advPlace(){const m=advMap(),p=$('#advP');if(!p)return;p.style.left=ADV.x/m[0].length*100+'%';p.style.top=ADV.y/m.length*100+'%';p.classList.toggle('flip',ADV.face<0);}
function advMove(dx,dy){
  if(ADV.dlg||ADV.clear)return;const m=advMap(),nx=ADV.x+dx,ny=ADV.y+dy;if(dx)ADV.face=dx;
  if(!advWalkable(m,nx,ny)){advBump(advAt(m,nx,ny));advPlace();return false;}
  ADV.x=nx;ADV.y=ny;if(ADV.say){ADV.say='';const sy=$('#advP .say');if(sy)sy.remove();}advPlace();
  const p=$('#advP');if(p){p.classList.add('walk');clearTimeout(ADV._wk);ADV._wk=setTimeout(()=>p.classList.remove('walk'),220);}
  return advArrive();
}
function advBump(ch){
  if(ch==='K'){say('어서 오세요! 주문은 반짝이는 자리에서 해 주세요.');toast('🧑‍🍳 어서 오세요!');}
  else if(ch==='n'){say('안녕! 이따 같이 먹자.');toast('🧒 친구: 안녕! 이따 같이 먹자.');}
  else if(ADV_BODY[ch]!==undefined)toast(`🚪 ${ADV_SHOPS[ADV_BODY[ch]].name} 문으로 들어가요`);
  else if(ch==='T')toast('🪑 탁자예요. 돌아서 가요.');
}
function advTapTo(tx,ty){
  if(ADV.dlg||ADV.clear)return;const m=advMap();
  if(!advWalkable(m,tx,ty)){advBump(advAt(m,tx,ty));return;}
  const W=m[0].length,key=(x,y)=>y*W+x,prev=new Map([[key(ADV.x,ADV.y),null]]),q=[[ADV.x,ADV.y]];let found=false;
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty){found=true;break;}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(advWalkable(m,nx,ny)&&!prev.has(key(nx,ny))){prev.set(key(nx,ny),[x,y]);q.push([nx,ny]);}}}
  if(!found){toast('거기는 못 가요 🙂');return;}
  const path=[];let cur=[tx,ty];while(cur&&!(cur[0]===ADV.x&&cur[1]===ADV.y)){path.unshift(cur);cur=prev.get(key(cur[0],cur[1]));}
  clearInterval(ADV.timer);ADV.path=path;
  ADV.timer=setInterval(()=>{const n=ADV.path.shift();if(!n||ADV.dlg||ADV.clear){clearInterval(ADV.timer);return;}
    const stop=advMove(n[0]-ADV.x,n[1]-ADV.y);if(stop===true||!ADV.path.length)clearInterval(ADV.timer);},170);
}
function advArrive(){
  const m=advMap(),ch=advAt(m,ADV.x,ADV.y);
  if(ADV.view==='town'){if(ADV_DOORS[ch]!==undefined){advEnter(ADV_DOORS[ch]);return true;}return false;}
  if(ch==='x'){advLeave(false);return true;}
  const si=advSpots().findIndex(p=>p[0]===ADV.x&&p[1]===ADV.y);if(si<0)return false;
  const next=advNextIdx();
  if(ADV.done[si]){toast('여기는 벌써 다 했어요 ✅');return false;}
  if(si!==next){toast(`먼저 ✨ ${advShop().scenes[next].title} 자리로 가요`);return false;}
  advStart(si);return true;
}
function advEnter(i){clearInterval(ADV.timer);const S=ADV_SHOPS[i];ADV.store=i;ADV.view='shop';ADV.done={};ADV.x=3;ADV.y=6;ADV.face=1;ADV.say='';ADV.clear=false;
  advRender();say(`${S.name}에 들어왔어요.`);toast(`${S.ico} ${S.name}에 들어왔어요!`);}
function advLeave(byBtn){
  clearInterval(ADV.timer);const next=advNextIdx();
  if(next>=0&&!byBtn&&!ADV._ask){ADV._ask=true;ADV.say='아직 할 일이 있어요';toast('아직 ✨ 할 일이 남았어요. 한 번 더 문으로 가면 나가요.');advRender();setTimeout(()=>{ADV._ask=false;},4000);return;}
  ADV._ask=false;ADV.view='town';ADV.clear=false;ADV.say='';ADV.dlg=null;
  const ch=Object.keys(ADV_DOORS).find(k=>ADV_DOORS[k]===ADV.store);ADV_TOWN.forEach((r,y)=>{const x=r.indexOf(ch);if(x>=0){ADV.x=x;ADV.y=y;}});
  advRender();
}
/* ── 대화 ── */
function advStart(k){clearInterval(ADV.timer);const sc=advShop().scenes[k];ADV.dlg={k,sc,i:0,opts:null,picked:false,bad:[],hint:''};advStep();}
function advStep(){
  const d=ADV.dlg;if(!d)return;
  if(d.i>=d.sc.lines.length){advSceneDone();return;}
  const l=d.sc.lines[d.i];d.opts=null;d.picked=false;d.bad=[];d.hint='';
  if(l.who!=='나'){advRender();say(l.t,.85);return;}
  const s=stu();
  if(+s.level===1){d.picked=true;advRender();setTimeout(()=>say(advEasy(l),.75),300);return;}
  d.opts=shuffle([{t:l.t,ok:true}].concat((l.wrong||[]).slice(0,2).map(t=>({t,ok:false}))));advRender();
}
function advDlgHTML(){
  const d=ADV.dlg,l=d.sc.lines[d.i],S=advShop(),s=stu();
  const head=`<div class="adv-who"><span>${S.ico} ${esc(d.sc.title)} · ${d.i+1}/${d.sc.lines.length}</span></div>`;
  if(l.who!=='나')return `<div class="rpg-dlg">${head}<div class="adv-who"><span class="face">${ADV_ICO[l.who]||'🙂'}</span><b>${esc(l.who)}</b></div>
    <div class="rpg-bub" id="advHear">${esc(l.t)} 🔊</div><div class="rpg-ctrl"><button class="btn pri" id="advNext">다음 ▶</button></div></div>`;
  const lv1=+s.level===1,said=lv1?advEasy(l):l.t,lr=ADV.store!==1&&advLearned(said);
  const prev=d.sc.lines.slice(0,d.i).reverse().find(x=>x.who!=='나');
  const tag=lr?`<div class="rpg-learn">🥡 중국집에서 배운 말이에요! <b>${esc(lr)}</b></div>`:'';
  if(d.picked)return `<div class="rpg-dlg" style="--st:${s.color}">${head}
    ${prev?`<div class="rpg-tip">${ADV_ICO[prev.who]||'🙂'} ${esc(prev.who)}: ${esc(prev.t)}</div>`:''}
    <div class="adv-who"><span class="face">${s.ic}</span><b style="color:${s.color}">${esc(s.name)}</b> — ${lv1?'🔊 듣고 따라 말해요':'👏 좋아요! 이제 직접 말해요'}</div>
    <div class="rpg-bub mine ${lv1?'tg-open':''}" id="advHear">${lv1?hlOpen(said):esc(said)} 🔊</div>${tag}
    <div class="rpg-ctrl"><button class="btn jade" data-mk="a">⭐ 혼자 말했어요</button><button class="btn gold" data-mk="b">🤝 도움 받아 말했어요</button><button class="btn" id="advSlow">🐢 천천히 듣기</button></div></div>`;
  return `<div class="rpg-dlg" style="--st:${s.color}">${head}
    ${prev?`<div class="rpg-tip">${ADV_ICO[prev.who]||'🙂'} ${esc(prev.who)}: ${esc(prev.t)}</div>`:''}
    <div class="adv-who"><span class="face">${s.ic}</span><b style="color:${s.color}">${esc(s.name)}</b>는 무슨 말을 할까요?</div>
    <div class="opts">${d.opts.map((o,j)=>`<button class="opt ${d.bad.includes(j)?'no':''}" data-j="${j}">${esc(o.t)}</button>`).join('')}</div>
    ${d.hint?`<div class="rpg-tip">🤔 ${d.hint}</div>`:''}</div>`;
}
function advBindDlg(host){
  const d=ADV.dlg;if(!d)return;const l=d.sc.lines[d.i];
  const said=(+stu().level===1&&l.who==='나')?advEasy(l):l.t;
  const h=host.querySelector('#advHear');if(h)h.onclick=()=>say(said,l.who==='나'?.78:.85);
  const n=host.querySelector('#advNext');if(n)n.onclick=()=>{try{speechSynthesis.cancel();}catch(e){}d.i++;advStep();};
  const sl=host.querySelector('#advSlow');if(sl)sl.onclick=()=>say(said,.6);
  host.querySelectorAll('.rpg-dlg .opt').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,o=d.opts[j];if(d.picked)return;
    if(o.ok){d.picked=true;beep(true);say(l.t,.78);advRender();}
    else{d.bad.push(j);beep(false);d.hint=o.t.startsWith('(')?'아무 말도 안 하면 상대가 몰라요. 다시 골라 봐요.':'그렇게 말하면 듣는 사람이 기분이 안 좋을 수 있어요. 다시 골라 봐요.';advRender();}});
  host.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.mk,S=advShop();rec(CUR,'adv',`${S.ico} ${said}`,v);
    ADV.coins+=v==='a'?3:1;if(v==='a'){beep(true);toast('⭐ 스스로 말했어요! +3💰');}else toast('🤝 도움 받고 말했어요 +1💰');
    d.i++;

}
function advSceneDone(){

  const next=advNextIdx();
  if(next<0){ADV.cleared=ADV.cleared||{};ADV.cleared[ADV.store]=true;ADV.clear=true;say(`${S.name} 모험을 다 했어요. 정말 잘했어요!`);advRender();}
  else{ADV.say='+5 💰';toast(`✅ ${d.sc.title} 성공! 다음 ✨ ${S.scenes[next].title}`);advRender();}
}
function advClearHTML(){

    ${left.length?`<p class="sub" style="margin-top:6px">다른 가게에서도 말해 봐요: ${left.map(x=>x.ico+' '+x.name).join(' · ')}</p>`:'<p class="sub" style="margin-top:6px">세 가게를 모두 다녀왔어요! 🌟 칭찬 시간으로 가요.</p>'}
    <div class="rpg-ctrl" style="margin-top:10px"><button class="btn pri" id="advTown">🏘️ 마을로 나가기</button>${left.length?'':'<button class="btn gold" id="advPraise">🌟 칭찬 시간</button>'}</div></div></div>`;
}
document.addEventListener('click',e=>{
  if(e.target.id==='advTown')advLeave(true);

});
document.addEventListener('keydown',e=>{
  if(VIEW!=='game'||G.pick!=='adv'||!$('#advHost'))return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;

renderWho();go('home');

<script>

(function(){
'use strict';
const PRAISE=[['👍','최고야!'],['🗣️','크게 말했어!'],['🔄','차례를 잘 지켰어!'],['📖','글자를 잘 읽었어!'],['✍️','바르게 썼어!'],['💪','끝까지 열심히 했어!'],['😊','예쁘게 말했어!'],['👂','내 말을 잘 들어 줬어!']];
const BADGE=[['play','🎮','놀이'],['speak','🗣️','말하기'],['trace','✍️','따라쓰기'],['wordw','🔤','낱말 쓰기'],['read','👀','읽기'],['turn','🔄','말 차례'],['game','🏆','게임'],['adv','🗺️','모험']];
const ST={g:0,stk:{},pick:null,done:false};

const callName=n=>{const c=String(n).charCodeAt(String(n).length-1)-0xAC00;return n+((c>=0&&c<11172&&c%28)?'아':'야');};
function tally(id){
  const r=REC[id]||{};let a=0,b=0;const per={};
  BADGE.forEach(([k])=>{let n=0;
    if(k==='game'){const g=r.game;if(g){n=g.score||0;a+=n;}}
    else{const o=(k==='play'?r.quests:r[k])||{};Object.values(o).forEach(v=>{if(v==='a'){a++;n++;}else if(v==='b'){b++;n++;}});}
    per[k]=n;});
  return {a,b,per,stars:r.playStars||0};
}
function pairs(){const S=DATA.students;if(S.length<2)return S.map(s=>({g:null,r:s}));return S.map((s,i)=>({g:s,r:S[(i+1)%S.length]}));}
function render(){
  if(M.classList.contains('hidden'))return;
  const S=DATA.students,P=pairs(),cur=ST.done?null:P[ST.g%P.length];
  const dishes=['🥟','🍜','🍝','🍲','🍛','🍖','🥤','🍔','☕','🍟'];
  let h=`<div class="pr-cards">${S.map(s=>{const t=tally(s.id);const plate=Array.from({length:Math.min(t.a+t.b,16)},(_,i)=>dishes[i%dishes.length]).join('')||'🍽️';
    const bd=BADGE.filter(([k])=>t.per[k]>0).map(([k,e,n])=>`<span><b>${e}</b>${n} ${t.per[k]}</span>`).join('');
    const stk=(ST.stk[s.id]||[]);
    return `<div class="pr-card ${cur&&cur.r.id===s.id?'recv':''}" style="--st:${s.color}">
      <div class="ava">${s.ic}</div><div class="nm">${esc(s.name)}</div>
      <div class="pr-plate" aria-hidden="true">${plate}</div>
      <div class="pr-cnt"><span>⭐ 혼자 ${t.a}</span><span>🤝 도움 ${t.b}</span></div>
      <div class="pr-badges">${bd||'<span style="border:none;background:none">🌱 이제 시작해요!</span>'}</div>
      <div class="pr-stk">${stk.length?stk.map(x=>`<span class="s">${x}</span>`).join(''):'<span class="e">💌 친구에게 받은 칭찬이 여기에 붙어요</span>'}</div></div>`;}).join('')}</div>`;
  if(ST.done){
    h+=`<div class="pr-time"><div class="pr-big">🎉 서로 칭찬해 주었어요! 짝짝짝 👏</div>
      <div class="row" style="justify-content:center"><button class="btn" id="prAgain">💬 한 번 더 칭찬하기</button><button class="btn pri" id="prEnd">✅ 오늘 수업 끝</button></div></div>`;
  }else{
    const g=cur.g,r=cur.r;
    h+=`<div class="pr-time" style="--g:${g?g.color:'var(--red)'};--r:${r.color}">
      <div class="h3" style="margin:0">💬 칭찬 시간</div>
      <div class="pr-who"><span>${g?`<span class="g">${g.ic} ${esc(g.name)}</span>${iga(g.name)}`:'<span class="g">👩‍🏫 선생님</span>이'}</span><span><span class="r">${r.ic} ${esc(r.name)}</span>에게</span><span>칭찬해요</span></div>
      <div class="pr-btns">${PRAISE.map(([e,t],i)=>`<button data-i="${i}" class="${ST.pick===i?'on':''}"><i>${e}</i>${t}</button>`).join('')}</div>
      <div class="row" style="justify-content:center">${ST.pick!=null?`<button class="btn pri" id="prNext" style="font-size:20px">${ST.g+1<P.length?'다음 친구 차례 ▶':'칭찬 끝 🎉'}</button>`:'<span class="sub">칭찬하고 싶은 말을 골라서 친구에게 말해 줘요.</span>'}</div></div>`;
  }
  $('#prBody').innerHTML=h;
  $('#prBody').querySelectorAll('.pr-btns button').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,[e,t]=PRAISE[i],r=cur.r;
    if(ST.pick!=null){const L=ST.stk[r.id]||[];L.pop();}
    ST.pick=i;(ST.stk[r.id]=ST.stk[r.id]||[]).push(e+' '+t);beep(true);say(callName(r.name)+', '+t);render();});
  if($('#prNext'))$('#prNext').onclick=()=>{ST.pick=null;ST.g++;if(ST.g>=P.length){ST.done=true;say('서로 칭찬해 주었어요. 모두 정말 잘했어요!');}else{const n=pairs()[ST.g];if(n.g){CUR=n.g.id;renderWho();say(n.g.name+' 차례예요');}}render();};
  if($('#prAgain'))$('#prAgain').onclick=()=>{ST.g=0;ST.pick=null;ST.done=false;render();};
  if($('#prEnd'))$('#prEnd').onclick=close;
}
const M=document.createElement('div');M.className='modal hidden';M.id='resModal';M.dataset.dyn='1';
M.innerHTML='<div class="pr-box"><div class="pr-head"><div class="t">🌟 오늘 우리가 해냈어요!</div><button class="btn sm" id="prClose">닫기 ✕</button></div><div class="pr-body" id="prBody"></div></div>';
document.body.appendChild(M);
$('#prClose').onclick=close;
const btn=document.createElement('button');btn.className='tbtn txt';btn.id='resBtn';btn.dataset.dyn='1';btn.title='결과 보고 서로 칭찬하기';btn.textContent='🌟 칭찬 시간';
btn.onclick=()=>open();
$('.topr').insertBefore(btn,$('#sndBtn'));
function open(){ST.g=0;ST.pick=null;ST.done=false;const P=pairs();if(P[0]&&P[0].g){CUR=P[0].g.id;renderWho();}
  M.classList.remove('hidden');try{speechSynthesis.cancel();}catch(e){}render();say('오늘 우리가 해냈어요! 서로 칭찬해 볼까요?');}
function close(){M.classList.add('hidden');try{speechSynthesis.cancel();}catch(e){}}
window.RES={open,close,render,isOpen:()=>!M.classList.contains('hidden')};
})();

/* ═════════ HTML 내보내기: 모든 스크립트가 들어가게 ═════════ */
(function(){
async function sourceHTML(){
  if(/^https?:/.test(location.protocol)){
    try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});const t=await r.text();if(t.includes('id="userData"')&&t.includes('sourceHTML'))return t;}catch(e){}
  }
  const c=document.documentElement.cloneNode(true);
  c.querySelectorAll('[data-dyn]').forEach(n=>n.remove());
  ['v-home','v-play','v-show','v-turn','v-ws','v-game','who','mbody','etabs'].forEach(id=>{const n=c.querySelector('#'+id);if(n)n.innerHTML='';});
  ['v-play','v-show','v-turn','v-ws','v-game'].forEach(id=>{const n=c.querySelector('#'+id);if(n)n.classList.add('hidden');});
  const m=c.querySelector('#modal');if(m)m.classList.add('hidden');
  const t=c.querySelector('#toast');if(t){t.className='';t.textContent='';}
  c.querySelectorAll('#stages button').forEach(b=>b.classList.remove('on'));
  const b=c.querySelector('body');if(b){b.removeAttribute('style');b.removeAttribute('class');}
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
exportHTML=async function(){
  const out=Object.assign({},DATA,{docId:'d'+Date.now().toString(36),savedAt:Date.now()});
  const json=JSON.stringify(out).replace(/</g,'\\u003c');
  const src=await sourceHTML();
  const html=src.replace(/(<script id="userData" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  const name=`중국집에서하는말_편집본_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.html`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('💾 '+name+' 파일로 내보냈어요');
};
})();
