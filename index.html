<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🥡 중국집에서 하는 말 — 수업 자료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E9; --card:#FFFFFF; --ink:#2B2320; --sub:#7A6A5E; --line:#EADCC8; --soft:#FBEFDD;
  --red:#C8352E; --red2:#E25A45; --gold:#E9A436; --jade:#2E9C7C; --blue:#3B7DD8; --pink:#E0558F;
  --ok:#1F9D6B; --ok-soft:#E3F6EC; --no:#D9534F; --no-soft:#FCE9E8;
  --shadow:0 2px 0 rgba(0,0,0,.04),0 10px 26px rgba(90,50,20,.12);
  --st:#3B7DD8; --st-soft:#E4EEFB;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:500;
  background-image:radial-gradient(circle at 12px 12px,rgba(200,53,46,.07) 2px,transparent 2.5px);background-size:24px 24px;-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
input,select,textarea{font:inherit;color:inherit;}
.j{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;}
.hidden{display:none!important;}
#app{min-height:100%;display:flex;flex-direction:column;}

/* ─── 위쪽 막대 ─── */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--red);color:#fff;flex-wrap:wrap;position:sticky;top:0;z-index:30;
  box-shadow:0 4px 0 #9E2620;}
.brand{font-family:'Jua',sans-serif;font-size:22px;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.brand small{font-size:13px;opacity:.85;font-family:'Noto Sans KR',sans-serif;}
.stages{display:flex;gap:6px;flex-wrap:wrap;}
.stages button{font-family:'Jua',sans-serif;font-size:16px;padding:7px 13px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap;}
.stages button.on{background:#fff;color:var(--red);box-shadow:0 3px 0 #9E2620;}
.stages button b{display:inline-block;background:var(--gold);color:#3a2300;border-radius:999px;width:20px;height:20px;font-size:13px;line-height:20px;text-align:center;margin-right:4px;}
.stages button.on b{background:var(--red);color:#fff;}
.topr{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.who{display:flex;gap:4px;background:rgba(0,0,0,.18);padding:4px;border-radius:14px;}
.who button{font-family:'Jua',sans-serif;font-size:16px;padding:5px 11px;border-radius:10px;color:#fff;opacity:.75;white-space:nowrap;}
.who button.on{background:#fff;color:var(--c);opacity:1;}
.tbtn{font-size:18px;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);}
.tbtn.on{background:#fff;color:var(--red);}
.tbtn.txt{width:auto;padding:0 12px;font-family:'Jua',sans-serif;font-size:16px;}
main{flex:1;min-height:0;}
.view{max-width:1240px;margin:0 auto;padding:18px 16px 40px;}

/* ─── 공통 조각 ─── */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px 20px;}
.h2{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(24px,3vw,32px);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.h3{font-family:'Jua',sans-serif;font-weight:400;font-size:21px;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.sub{color:var(--sub);font-size:14px;line-height:1.6;}
.chip{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--soft);margin:2px 3px 2px 0;white-space:nowrap;}
.chip.st{background:var(--st-soft);color:var(--st);font-weight:700;}
.btn{font-family:'Jua',sans-serif;font-size:17px;padding:9px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);white-space:nowrap;}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line);}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 3px 0 #9E2620;}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2300;box-shadow:0 3px 0 #B87A1C;}
.btn.jade{background:var(--jade);border-color:var(--jade);color:#fff;box-shadow:0 3px 0 #1E6F57;}
.btn.st{background:var(--st);border-color:var(--st);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--st) 70%,#000);}
.btn.sm{font-size:14px;padding:5px 10px;border-radius:10px;}
.btn:disabled{opacity:.4;pointer-events:none;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.grow{flex:1;}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:10px 20px;border-radius:14px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:all .2s;z-index:90;max-width:90vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%);}
.pop{animation:pop .35s;} @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:none}}
.shake{animation:shake .35s;} @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 한 문장씩 들어오기 */
.enter{animation:enter .4s cubic-bezier(.2,.8,.2,1) both;}
.enter.back{animation-name:enterBack;}
@keyframes enter{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes enterBack{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
.drop{animation:drop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*.55s);}
@keyframes drop{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.dots{display:inline-flex;gap:7px;align-items:center;}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);}
.dots i.on{background:var(--st);}
.npc .b.one{font-size:clamp(24px,3.4vw,38px);padding:16px 22px;}
.dlgin.solo{padding:22px 24px;}
.say.sm{font-size:clamp(28px,4.4vw,54px);}

/* ─── 수업 안내 ─── */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px;}
.hero .card{position:relative;overflow:hidden;}
.hero h1{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(30px,4.4vw,48px);line-height:1.1;}
.hero h1 em{font-style:normal;color:var(--red);}
.goalbox{background:var(--soft);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:17px;font-weight:700;line-height:1.55;}
.goalbox::before{content:'🎯 차시 목표';display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:15px;color:var(--red);margin-bottom:2px;}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.fstep{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;border-top:6px solid var(--fc);}
.fstep .n{font-family:'Jua',sans-serif;color:var(--fc);font-size:15px;}
.fstep .t{font-family:'Jua',sans-serif;font-size:21px;margin:2px 0 4px;}
.fstep .d{font-size:13.5px;color:var(--sub);line-height:1.5;}
.fstep .m{float:right;font-size:12px;background:var(--soft);border-radius:999px;padding:2px 8px;color:var(--sub);}
.studs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0;}
.scard{border-left:10px solid var(--st);}
.scard .nm{font-family:'Jua',sans-serif;font-size:26px;display:flex;align-items:center;gap:8px;}
.scard .nm .ic{font-size:40px;}
.scard .fo{font-size:13px;font-weight:700;background:var(--st-soft);color:var(--st);border-radius:999px;padding:3px 10px;}
.scard .g{font-size:16px;font-weight:700;line-height:1.55;margin:8px 0;}
.levt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
.levt th,.levt td{border-bottom:1.5px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top;line-height:1.5;}
.levt th{color:var(--sub);font-weight:700;font-size:12px;}
.levt td.c{white-space:nowrap;font-family:'Jua',sans-serif;color:var(--st);}
.recs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.recs span{background:var(--soft);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700;}
.src{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:14px;border-top:1.5px dashed var(--line);padding-top:10px;}

/* ─── 동기유발: 중국집 놀이 ─── */
.play{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start;}
.mapwrap{position:relative;}
.map{position:relative;width:100%;aspect-ratio:16/10;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);border:6px solid #8B2A23;
  background:
    linear-gradient(#B8402F 0 15%,#8B2A23 15% 16.5%,transparent 16.5%),
    repeating-conic-gradient(#F3E0C2 0 25%,#EBD3AE 0 50%) 0 0/8% 12.8%;
  touch-action:none;user-select:none;-webkit-user-select:none;}
.map::after{content:'';position:absolute;left:0;right:0;top:0;height:15%;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,215,120,.18) 46px 52px);pointer-events:none;}
.sign{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);font-family:'Jua',sans-serif;color:#FFE08A;font-size:clamp(16px,2.4vw,28px);
  background:#7A1E18;border:3px solid #E9A436;border-radius:10px;padding:2px 18px;z-index:2;white-space:nowrap;letter-spacing:2px;}
.obj{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3;}
.obj .e{line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18));}
.obj .l{font-family:'Jua',sans-serif;font-size:clamp(11px,1.3vw,15px);background:rgba(255,255,255,.88);border-radius:999px;padding:0 8px;margin-top:2px;white-space:nowrap;}
.obj.target::before{content:'❗';position:absolute;top:-34%;font-size:clamp(18px,2.6vw,30px);animation:bob .8s infinite alternate;}
@keyframes bob{to{transform:translateY(-8px)}}
.obj .food{position:absolute;top:-6%;font-size:.5em;}
.map.edit .obj{cursor:move;outline:2px dashed rgba(59,125,216,.5);outline-offset:4px;border-radius:10px;}
.map.edit .obj.sel{outline:3px solid var(--blue);}
.me{position:absolute;transform:translate(-50%,-80%);z-index:5;display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:none;}
.me .e{font-size:clamp(34px,5.4vw,62px);line-height:1;filter:drop-shadow(0 5px 2px rgba(0,0,0,.25));}
.me .e.flip{transform:scaleX(-1);}
.me .tag{font-family:'Jua',sans-serif;font-size:13px;background:var(--st);color:#fff;border-radius:999px;padding:0 8px;margin-top:-2px;}
.me.walk .e{animation:walk .28s infinite alternate;}
@keyframes walk{to{translate:0 -4px}}
.talkbtn{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:8;font-family:'Jua',sans-serif;font-size:clamp(18px,2.4vw,26px);
  background:var(--gold);color:#3a2300;border-radius:999px;padding:10px 26px;box-shadow:0 5px 0 #B87A1C;animation:pop .35s;}
.pad{position:absolute;right:2%;bottom:4%;z-index:7;display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:3px;opacity:.9;}
.pad button{background:rgba(255,255,255,.9);border-radius:12px;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.15);}
.pad button:active{background:var(--gold);}
.dlg{position:absolute;inset:0;z-index:10;background:rgba(43,35,32,.45);display:flex;align-items:flex-end;justify-content:center;padding:3%;}
.dlgin{width:min(760px,100%);background:var(--card);border-radius:22px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .3s;}
.npc{display:flex;gap:12px;align-items:flex-start;}
.npc .e{font-size:54px;line-height:1;}
.npc .b{background:var(--soft);border-radius:6px 20px 20px 20px;padding:10px 16px;font-size:clamp(18px,2.3vw,24px);font-weight:700;line-height:1.45;flex:1;}
.npc .b small{display:block;font-size:13px;color:var(--sub);}
.ask{font-family:'Jua',sans-serif;font-size:18px;color:var(--st);margin:12px 0 8px;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{text-align:left;font-size:clamp(17px,2.2vw,22px);font-weight:700;padding:10px 16px;border-radius:16px;background:var(--card);border:3px solid var(--line);box-shadow:0 3px 0 var(--line);}
.opt:hover{border-color:var(--st);}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
.opt.no{background:var(--no-soft);border-color:var(--no);color:var(--no);}
.opt.hint{border-color:var(--gold);box-shadow:0 0 0 4px rgba(233,164,54,.35);}
.menupick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.menupick button{background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:8px 14px;min-width:110px;}
.menupick button .e{font-size:48px;display:block;}
.menupick button b{font-family:'Jua',sans-serif;font-weight:400;font-size:22px;}
.menupick button:hover{border-color:var(--red);}
.side .card{padding:14px 16px;margin-bottom:12px;}
.ql{list-style:none;display:flex;flex-direction:column;gap:6px;}
.ql li{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:700;padding:6px 8px;border-radius:12px;}
.ql li .k{width:26px;height:26px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;flex-shrink:0;}
.ql li.cur{background:var(--st-soft);color:var(--st);}
.ql li.cur .k{background:var(--st);color:#fff;}
.ql li.done{color:var(--sub);text-decoration:line-through;}
.ql li.done .k{background:var(--ok);color:#fff;}
.stars{font-size:22px;letter-spacing:2px;}
.prop label{font-size:13px;color:var(--sub);font-weight:700;display:block;margin-top:8px;}
.prop input,.prop select{width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;}
.emopick{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.emopick button{font-size:22px;width:34px;height:34px;border-radius:8px;}
.emopick button:hover{background:var(--soft);}

/* ─── 보여주기 ─── */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.tabs button{font-family:'Jua',sans-serif;font-size:18px;padding:9px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.tabs button i{font-style:normal;font-size:12px;margin-left:4px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--sub);font-family:'Noto Sans KR',sans-serif;font-weight:700;}
.tabs button.on i{background:rgba(255,255,255,.2);color:#fff;}
.lvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.lv{display:inline-flex;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px;}
.lv button{font-family:'Jua',sans-serif;font-size:15px;padding:5px 12px;border-radius:10px;}
.lv button.on{background:var(--st);color:#fff;}
.stage{background:var(--card);border-radius:26px;box-shadow:var(--shadow);border-top:10px solid var(--st);min-height:min(66vh,620px);display:flex;flex-direction:column;padding:18px clamp(16px,3vw,34px);gap:12px;position:relative;}
.kick{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--sub);flex-wrap:wrap;}
.kick b{background:var(--st);color:#fff;font-family:'Jua',sans-serif;font-weight:400;padding:3px 11px;border-radius:999px;}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;}
.sit{font-size:clamp(70px,10vw,120px);line-height:1;}
.sitt{font-family:'Jua',sans-serif;font-size:clamp(20px,2.8vw,30px);color:var(--sub);}
.say{font-family:'Jua',sans-serif;font-size:clamp(34px,5.6vw,68px);line-height:1.25;word-break:keep-all;}
.say .w{display:inline-block;margin:0 .14em;}
.say .w.dim{color:transparent;border-bottom:5px dashed var(--line);}
.prompts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.prompts button{font-size:15px;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--soft);border:2px solid var(--line);}
.prompts button.on{background:var(--gold);border-color:var(--gold);color:#3a2300;}
.navb{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:12px;}
.navb .cnt{font-family:'Jua',sans-serif;font-size:18px;min-width:70px;text-align:center;}
.recb{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.recb button{font-size:15px;font-weight:700;padding:7px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;}
.recb button.on.a{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);}
.recb button.on.b{background:#FFF3DA;border-color:var(--gold);color:#9A6200;}
.recb button.on.c{background:var(--no-soft);border-color:var(--no);color:var(--no);}
.sayl{font-size:22px;padding:8px 16px;border-radius:14px;background:var(--st-soft);color:var(--st);font-family:'Jua',sans-serif;}
/* 칸 쓰기 */
.gridwrap{position:relative;align-self:center;max-width:100%;}
.gboxes{display:flex;flex-wrap:wrap;gap:0;justify-content:center;}
.gb{width:var(--gs,92px);height:var(--gs,92px);border:2.5px solid #D9A99A;margin:-1.25px;display:flex;align-items:center;justify-content:center;position:relative;
  font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:calc(var(--gs,92px)*.68);line-height:1;background:#fff;
  background-image:linear-gradient(#F3D7CF,#F3D7CF),linear-gradient(#F3D7CF,#F3D7CF);background-size:100% 1.5px,1.5px 100%;background-position:center;background-repeat:no-repeat;}
.gb.g1{color:#C9C2BC;} .gb.g2{color:transparent;-webkit-text-stroke:1.4px #CFC7C0;} .gb.g0{color:transparent;}
.gb.sp{background:#FBF4EA;border-color:#EFD9CE;}
.gbrk{flex-basis:100%;height:10px;}
.ink{position:absolute;inset:0;touch-action:none;cursor:crosshair;}
.model{font-family:'Jua',sans-serif;font-size:clamp(26px,3.6vw,40px);color:var(--st);}
.wordbig{display:flex;gap:6px;justify-content:center;}
.wordbig button{font-family:'Jua',sans-serif;font-size:clamp(70px,12vw,150px);line-height:1.1;padding:4px 14px;border-radius:22px;background:var(--soft);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);}
.wordbig button:active,.wordbig button.lit{background:var(--st);color:#fff;border-color:var(--st);}
.snd{font-family:'Jua',sans-serif;font-size:clamp(22px,3vw,32px);background:#FFF3DA;color:#9A6200;border-radius:16px;padding:6px 16px;}

/* ─── 활동지 ─── */
.wsl{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;}
.wsopt{position:sticky;top:76px;}
.wsopt label.ck{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:700;padding:5px 4px;}
.wsopt label.ck input{width:18px;height:18px;}
.wsopt select{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;width:100%;}
.wsopt h4{font-size:13px;color:var(--sub);margin:12px 0 4px;}
.papers{display:flex;flex-direction:column;gap:20px;align-items:center;}
.paper{width:210mm;max-width:100%;min-height:297mm;background:#fff;color:#222;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:13mm 14mm;position:relative;font-family:'Noto Sans KR',sans-serif;}
.paper .ph{display:flex;align-items:flex-end;gap:10px;border-bottom:3px solid #C8352E;padding-bottom:6px;margin-bottom:10px;}
.paper .ph h1{font-family:'Jua',sans-serif;font-weight:400;font-size:26px;flex:1;}
.paper .ph .nm{font-size:14px;white-space:nowrap;}
.paper .ph .nm span{display:inline-block;min-width:80px;border-bottom:1.5px solid #333;text-align:center;font-weight:700;}
.paper .pg{font-size:14px;background:#FFF4E6;border-radius:10px;padding:6px 10px;margin-bottom:10px;}

function gridHTML(text,cls,perRow){

}
function fitGrid(text,perRow){

function attachInk(wrap){
  const c=document.createElement('canvas');c.className='ink';wrap.appendChild(c);const g=c.getContext('2d');let down=false,lx=0,ly=0;
  const col=stu().color;
  const fit=()=>{const r=wrap.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;c.style.width=r.width+'px';c.style.height=r.height+'px';
    g.setTransform(d,0,0,d,0,0);g.lineCap='round';g.lineJoin='round';g.lineWidth=Math.max(5,Math.min(11,r.width/80));g.strokeStyle=col;};
  fit();
  const pos=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);[lx,ly]=pos(e);g.beginPath();g.arc(lx,ly,g.lineWidth/2,0,7);g.fillStyle=col;g.fill();};
  c.onpointermove=e=>{if(!down)return;const [x,y]=pos(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y;};
  c.onpointerup=c.onpointercancel=()=>down=false;
  return {clear:()=>g.clearRect(0,0,c.width,c.height)};
}

  $('#stg').innerHTML=`${kickH('🔤 낱말 적기')}
    <div class="big ${animC()}"><div class="sit">${it.e}</div>
      <div class="sub">${lv===3?'🔊 소리를 듣고 낱말을 써요.':lv===2?'첫 글자를 보고 나머지 글자를 써요.':'회색 글자를 따라 써요.'} (${[...it.w].length}글자)</div>
      <div class="gridwrap" id="gw"></div></div>
    <div class="row" style="justify-content:center"><button class="btn" id="wSay">🔊 듣기</button><button class="btn" id="wSlow">🐢 한 글자씩</button><button class="btn ${SH.reveal?'gold':''}" id="wRev">👀 정답 ${SH.reveal?'가리기':'보기'}</button><button class="btn" id="wClr">🧽 지우기</button></div>
    ${navHTML(items,'wordw',it.w,['✅ 바르게 썼어요','🤝 도움 받아 썼어요','🔁 다시 써요'])}`;
  const gw=$('#gw');gw.style.setProperty('--gs',Math.min(130,fitGrid(it.w,6))+'px');gw.innerHTML=gridHTML(it.w,cls,6);
  const ink=attachInk(gw);$('#wClr').onclick=ink.clear;
  $('#wSay').onclick=()=>say(it.w);$('#wSlow').onclick=()=>slowSay(it.w);
  $('#wRev').onclick=()=>{SH.reveal=!SH.reveal;renderShow();};
  if(lv===3)setTimeout(()=>say(it.w),300);
  bindNav(items,'wordw',it.w);
}
function slowSay(w,btns){[...w].forEach((ch,i)=>setTimeout(()=>{say(ch,.7);if(btns){btns.forEach(b=>b.classList.remove('lit'));btns[i]&&btns[i].classList.add('lit');}},i*800));
  if(btns)setTimeout(()=>btns.forEach(b=>b.classList.remove('lit')),[...w].length*800+200);}
/* 낱말 읽기 */
function shRead(it,items){
  $('#stg').innerHTML=`${kickH('👀 낱말 읽기')}
    <div class="big ${animC()}"><div class="sit" style="font-size:clamp(56px,7vw,90px)">${it.e}</div>
      <div class="wordbig" id="wb">${[...it.w].map(ch=>`<button>${esc(ch)}</button>`).join('')}</div>
      <div class="sub">👆 글자를 누르면 한 글자씩 소리 나요. 먼저 스스로 읽어 보고 🔊로 확인해요.</div>
      ${it.snd?`<div>${SH.snd?`<span class="snd">👂 소리: [${esc(it.snd)}] · ✏️ 쓸 때: ${esc(it.w)}</span>`:`<button class="btn gold" id="rSnd">👂 어떻게 소리 날까요?</button>`}</div>`:''}
    </div>
    <div class="row" style="justify-content:center"><button class="btn st" id="rSay">🔊 낱말 듣기</button><button class="btn" id="rSlow">🐢 한 글자씩</button></div>
    ${navHTML(items,'read',it.w,['✅ 혼자 읽었어요','🤝 도움 받아 읽었어요','🔁 다시 읽어요'])}`;
  const bs=[...$('#wb').querySelectorAll('button')];
  bs.forEach((b,i)=>b.onclick=()=>{say(b.textContent,.7);bs.forEach(x=>x.classList.remove('lit'));b.classList.add('lit');});
  $('#rSay').onclick=()=>say(it.w);$('#rSlow').onclick=()=>slowSay(it.w,bs);
  if($('#rSnd'))$('#rSnd').onclick=()=>{SH.snd=true;renderShow();say(it.w);};
  bindNav(items,'read',it.w);
}
</script>
<script>
/* ═════════ 📝 활동지 ═════════ */
const SEC={
 read:{t:'소리 내어 읽고 ☆에 색칠해요',ins:'한 번 읽을 때마다 ☆ 하나에 색칠해요.'},
 picword:{t:'그림을 보고 알맞은 낱말을 써요',ins:'그림을 보고 칸에 맞게 써요.'},
 traceword:{t:'낱말을 따라 써요',ins:'회색 글자를 따라 쓰고, 빈칸에 한 번 더 써요.'},
 tracesent:{t:'문장을 따라 써요',ins:'띄어 쓰는 곳(색칠된 칸)에 주의해요.'},
 choose:{t:'이럴 때 알맞은 말에 ○표 해요',ins:'중국집에서 바르게 말한 것을 골라요.'},
 dialog:{t:'대화의 빈칸에 알맞은 말을 써요',ins:'아래 낱말 상자에서 골라 써요.'},
 order:{t:'중국집에서 하는 일을 차례대로 번호를 써요',ins:'먼저 하는 일부터 ①, ②, ③ … 순서로 써요.'},
 self:{t:'스스로 평가해요',ins:'알맞은 얼굴에 ○표 해요.'},
 free:{t:'자유롭게 써요',ins:'선생님이 내용을 고쳐 쓰세요.'},
};
const SEC_DEF={speak:['choose','dialog','tracesent','order','self'],hangul:['read','picword','traceword','tracesent','self']};
function wsCfg(sid){const s=stu(sid);const c=DATA.ws[sid]||(DATA.ws[sid]={lv:s.level,secs:SEC_DEF[s.focus].slice(),title:`🥡 ${DATA.lesson.title} — 활동지`});return c;}
let WSWHO=null;
const boxes=(w,mode,sm)=>`<div class="wb ${sm?'sm':''}">${[...w].map((ch,k)=>ch===' '?'<span class="sp"></span>':`<span class="${mode==='g'||(mode==='f'&&k===0)?'':'e0'}">${esc(ch)}</span>`).join('')}</div>`;
function secBody(type,sid,lv){
  const s=stu(sid),W=shuffle(byLv(DATA.words,lv)),S=shuffle(byLv(DATA.sents,lv));
  const ed=t=>`<span contenteditable="true">${esc(t)}</span>`;
  if(type==='read')return `<div class="rd">${W.slice(0,6).map(w=>`<div><span class="pe">${w.e}</span> ${ed(w.w)}<small>☆☆☆</small></div>`).join('')}</div>`;
  if(type==='picword')return `<div class="wrow">${W.slice(0,4).map(w=>`<div class="witem"><span class="pe">${w.e}</span>${boxes(w.w,lv===1?'g':lv===2?'f':'e')}</div>`).join('')}</div>`;
  if(type==='traceword')return W.slice(0,3).map(w=>`<div class="wline"><span class="q pe">${w.e}</span>${boxes(w.w,'g')}${boxes(w.w,'g')}${boxes(w.w,'e')}</div>`).join('');
  if(type==='tracesent')return S.slice(0,2).map(x=>`<div class="wline" style="flex-direction:column;align-items:flex-start;gap:2px"><div><span class="pe">${x.e}</span> <b contenteditable="true">${esc(x.sit)}</b></div>${boxes(x.t,lv===3?'e':'g',true)}${boxes(x.t,'e',true)}</div>`).join('');
  if(type==='choose')return S.slice(0,3).map((x,i)=>{const o=shuffle([x.t,(x.wrong||['…'])[0]]);
    return `<div class="wline"><span class="q pe">${x.e}</span><b style="min-width:200px">${i+1}. ${ed(x.sit)}</b><div class="choice">${o.map(t=>`<span contenteditable="true">${esc(t)}</span>`).join('')}</div></div>`;}).join('');
  if(type==='dialog'){const T=[];DATA.quests.forEach(q=>q.turns.forEach(t=>T.push(t)));const pick=T.slice(0,1).concat(shuffle(T.slice(1)).slice(0,2));
    const m0=DATA.menu[0]||{n:'짜장면',p:'육천'},sw=x=>String(x).replace(/\{음식\}/g,m0.n).replace(/\{가격\}/g,m0.p);
    return `<div class="dlgw">${pick.map(t=>`<div class="l"><span class="wh">🧑‍🍳 점원</span>${ed(sw(t.npc))}</div><div class="l"><span class="wh">${s.ic} 나</span><span class="blank"></span></div>`).join('')}</div>
      <div class="bank">${shuffle(pick.map(t=>sw(t.ok))).map(t=>`<span contenteditable="true">${esc(t)}</span>`).join('')}</div>`;}
  if(type==='order')return `<div class="ordr">${shuffle(DATA.order).map(([e,t])=>`<div><span class="pe">${e}</span><span contenteditable="true">${esc(t)}</span><br><span class="bx"></span></div>`).join('')}</div>`;
  if(type==='self'){const L=s.focus==='speak'?['중국집에서 인사를 할 수 있어요.','먹고 싶은 음식을 "주세요"로 주문할 수 있어요.','"감사합니다", "얼마예요?"처럼 바르게 말했어요.','친구의 말을 끝까지 듣고 내 차례에 말했어요.']
      :['중국집 낱말을 소리 내어 읽을 수 있어요.','낱말을 칸에 맞게 바르게 쓸 수 있어요.','문장을 띄어 쓰는 곳에 주의하며 따라 쓸 수 있어요.','소리와 글자가 다른 낱말을 알아요.'];
    return `<table class="self">${L.map(t=>`<tr><td contenteditable="true">${esc(t)}</td><td class="f">😊 😐 😥</td></tr>`).join('')}</table>
      <div style="margin-top:6px;font-size:14px"><b>선생님 한마디</b><div class="tline" contenteditable="true"></div></div>`;}
  if(type==='free')return `<div class="free" contenteditable="true">여기에 내용을 쓰세요.</div><div class="tline"></div><div class="tline"></div>`;
  return '';
}
function secHTML(type,sid,lv,no){
  return `<div class="sec" data-type="${type}"><div class="stool"><button data-a="up" title="위로">↑</button><button data-a="dn" title="아래로">↓</button><button data-a="re" title="문제 다시 뽑기">🔀</button><button data-a="x" title="지우기">✕</button></div>
    <h3><span class="no">${no}</span><span contenteditable="true">${esc(SEC[type].t)}</span></h3><div class="ins" contenteditable="true">${esc(SEC[type].ins)}</div>
    <div class="sb">${secBody(type,sid,lv)}</div></div>`;
}
function pageHTML(sid){
  const s=stu(sid),c=wsCfg(sid),d=new Date();
  return `<div class="paper" data-sid="${sid}"><div class="ph"><h1 contenteditable="true">${esc(c.title)}</h1>
    <div class="nm">${d.getMonth()+1}월 ${d.getDate()}일 · 이름 <span contenteditable="true">${esc(s.name)}</span></div></div>
    <div class="pg"><b>🎯 나의 목표</b> <span contenteditable="true">${esc(s.goal)}</span></div>
    ${c.secs.map((t,i)=>secHTML(t,sid,c.lv,i+1)).join('')}</div>`;
}
function renderWS(){
  if(!WSWHO)WSWHO=CUR;
  const who=WSWHO==='all'?DATA.students.map(s=>s.id):[WSWHO];const one=WSWHO!=='all'?wsCfg(WSWHO):null;
  $('#v-ws').innerHTML=`<div class="wsl"><aside class="card wsopt">
    <div class="h3">📝 활동지 만들기</div>
    <h4>누구의 활동지?</h4><select id="wWho">${DATA.students.map(s=>`<option value="${s.id}" ${WSWHO===s.id?'selected':''}>${s.ic} ${esc(s.name)} (${FOCUS[s.focus]})</option>`).join('')}<option value="all" ${WSWHO==='all'?'selected':''}>👥 모두 (한 장씩)</option></select>
    ${one?`<h4>단계</h4><select id="wLv">${[1,2,3].map(n=>`<option value="${n}" ${one.lv===n?'selected':''}>${n}단계</option>`).join('')}</select>
    <h4>넣을 활동 (순서대로 들어가요)</h4>${Object.keys(SEC).map(k=>`<label class="ck"><input type="checkbox" data-k="${k}" ${one.secs.includes(k)?'checked':''}> ${SEC[k].t}</label>`).join('')}`:'<p class="sub" style="margin-top:8px">학생마다 고른 설정으로 한 장씩 만들어요. 설정은 학생을 하나씩 골라 바꿔요.</p>'}
    <h4>고치기</h4><p class="sub">글자는 눌러서 바로 고쳐요. 그림(이모지)을 누르면 바꿀 수 있어요. 각 칸 오른쪽 위 단추로 순서를 바꾸거나(↑↓) 문제를 다시 뽑거나(🔀) 지울(✕) 수 있어요. 고친 내용은 자동 저장돼요.</p>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="wPrint">🖨️ 인쇄하기</button><button class="btn" id="wNew">🔀 새로 만들기</button></div>
    <div class="row" style="margin-top:8px"><button class="btn sm jade" onclick="go('game')">다음: 마무리 게임 ▶</button></div>
  </aside><div class="papers" id="papers">${who.map(id=>DATA.wsHTML[id]||pageHTML(id)).join('')}</div></div>`;
  $('#wWho').onchange=e=>{WSWHO=e.target.value;renderWS();};
  if(one){
    $('#wLv').onchange=e=>{one.lv=+e.target.value;delete DATA.wsHTML[WSWHO];persist();renderWS();};
    $('#v-ws').querySelectorAll('.wsopt input[data-k]').forEach(c=>c.onchange=()=>{
      one.secs=[...$('#v-ws').querySelectorAll('.wsopt input[data-k]:checked')].map(x=>x.dataset.k);delete DATA.wsHTML[WSWHO];persist();renderWS();});
  }
  $('#wNew').onclick=()=>{if(!confirm('고친 내용을 지우고 문제를 새로 뽑을까요?'))return;who.forEach(id=>delete DATA.wsHTML[id]);persist();renderWS();};
  $('#wPrint').onclick=()=>{document.body.classList.add('printing');setTimeout(()=>{window.print();},50);};
  const pp=$('#papers');let t=null;
  const save=()=>{clearTimeout(t);t=setTimeout(()=>{pp.querySelectorAll('.paper').forEach(p=>{renum(p);DATA.wsHTML[p.dataset.sid]=p.outerHTML;});persist();},400);};
  pp.addEventListener('input',save);
  pp.addEventListener('click',e=>{
    const pe=e.target.closest('.pe');
    if(pe){const v=prompt('바꿀 그림(이모지)을 넣어 주세요.',pe.textContent.trim());if(v!=null&&v.trim()){pe.textContent=v.trim();save();}return;}
    const b=e.target.closest('.stool button');if(!b)return;
    const sec=b.closest('.sec'),paper=b.closest('.paper'),sid=paper.dataset.sid,a=b.dataset.a;
    if(a==='x'){sec.remove();}
    else if(a==='up'&&sec.previousElementSibling&&sec.previousElementSibling.classList.contains('sec'))sec.parentNode.insertBefore(sec,sec.previousElementSibling);
    else if(a==='dn'&&sec.nextElementSibling)sec.parentNode.insertBefore(sec.nextElementSibling,sec);
    else if(a==='re')sec.querySelector('.sb').innerHTML=secBody(sec.dataset.type,sid,wsCfg(sid).lv);
    save();
  });
}
function renum(p){p.querySelectorAll('.sec .no').forEach((n,i)=>n.textContent=i+1);}
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));

/* ═════════ 🏆 마무리 게임: 주문 왕 ═════════ */
const G={on:false,players:[],n:8,i:0,score:{},tray:{},log:[],mode:{},q:null,lock:false};
function renderGame(){
  if(G.on){gRound();return;}
  if(G.end){gEnd();return;}
  DATA.students.forEach(s=>{if(!G.mode[s.id])G.mode[s.id]=s.focus;});
  $('#v-game').innerHTML=`<div class="card gsetup"><div class="sit">🏆🥡</div><div class="h2" style="justify-content:center">중국집 주문 왕</div>
    <p class="sub" style="font-size:16px;margin:6px 0 14px">차례대로 문제를 풀어요. 맞힐 때마다 내 쟁반에 음식이 하나씩 쌓여요!</p>
    ${DATA.students.map(s=>`<div class="row" style="justify-content:center;margin:6px 0"><label class="row" style="font-family:Jua;font-size:20px;color:${s.color}"><input type="checkbox" class="gp" value="${s.id}" checked> ${s.ic} ${esc(s.name)}</label>
      <select class="gm" data-s="${s.id}" style="border:2px solid var(--line);border-radius:10px;padding:6px">${[['speak','🗣️ 상황 보고 알맞은 말 고르기'],['hangul','🔤 듣고 낱말 고르기']].map(([k,t])=>`<option value="${k}" ${G.mode[s.id]===k?'selected':''}>${t}</option>`).join('')}</select>
      <span class="chip">${s.level}단계</span></div>`).join('')}
    <div class="row" style="justify-content:center;margin:12px 0"><span class="j">문제 수</span>${[6,8,10].map(n=>`<label class="row"><input type="radio" name="gn" value="${n}" ${G.n===n?'checked':''}> ${n}개</label>`).join('')}</div>
    <button class="btn pri" id="gStart" style="font-size:22px;padding:12px 30px">▶ 게임 시작</button></div>`;
  $('#v-game').querySelectorAll('.gm').forEach(x=>x.onchange=()=>G.mode[x.dataset.s]=x.value);
  $('#gStart').onclick=()=>{
    G.players=[...$('#v-game').querySelectorAll('.gp:checked')].map(x=>x.value);if(!G.players.length){toast('함께할 학생을 골라 주세요.');return;}
    G.n=+($('#v-game').querySelector('input[name=gn]:checked')||{value:8}).value;G.i=0;G.score={};G.tray={};G.log=[];G.on=true;G.end=false;
    G.players.forEach(p=>{G.score[p]=0;G.tray[p]=[];});gNext();};
}
function gNext(){
  if(G.i>=G.n){G.on=false;G.end=true;G.players.forEach(p=>{const r=REC[p]=REC[p]||{};r.game={score:G.score[p],total:G.log.filter(l=>l.p===p).length,log:G.log.filter(l=>l.p===p).map(l=>({a:String(l.ans),ok:!!l.ok})),at:Date.now()};});saveRec();gEnd();return;}
  const p=G.players[G.i%G.players.length],s=stu(p),mode=G.mode[p];CUR=p;renderWho();
  if(mode==='speak'){const it=shuffle(byLv(DATA.sents,s.level))[0];
    const wr=(it.wrong||[]).slice(0,2);while(wr.length<2){const o=shuffle(DATA.sents).find(x=>x.t!==it.t&&!wr.includes(x.t));wr.push(o?o.t:'…');}
    G.q={p,mode,it,ans:it.t,opts:shuffle([it.t].concat(wr)),dish:(shuffle(DATA.menu)[0]||{e:'🍽️'}).e};}
  else{const L=byLv(DATA.words,s.level),it=shuffle(L)[0];const pool=shuffle(DATA.words.filter(w=>w.w!==it.w));const ds=[];
    if(it.snd)ds.push(it.snd);pool.forEach(w=>{if(ds.length<2&&!ds.includes(w.w))ds.push(w.w);});
    G.q={p,mode,it,ans:it.w,opts:shuffle([it.w].concat(ds.slice(0,2))),dish:it.e};}
  G.lock=false;gRound();
  setTimeout(()=>say(G.q.mode==='speak'?G.q.it.sit+'. 뭐라고 말할까요?':G.q.it.w),250);
}
function gRound(){
  const q=G.q,s=stu(q.p);
  $('#v-game').innerHTML=`<div class="gplay">${G.players.map(p=>{const x=stu(p);return `<div class="tray ${p===q.p?'on':''}" style="--st:${x.color}"><span class="nm">${x.ic} ${esc(x.name)}</span><div class="dish">${G.tray[p].join('')}</div><span class="sc">${G.score[p]}</span></div>`;}).join('')}
    <div class="card gq" style="border-top:8px solid ${s.color}"><div class="kick" style="margin-bottom:8px"><b style="background:${s.color}">${G.i+1} / ${G.n}</b><span>${s.ic} ${esc(s.name)} 차례 · ${q.mode==='speak'?'🗣️ 알맞은 말 고르기':'🔤 듣고 낱말 고르기'}</span></div>
      ${q.mode==='speak'?`<div class="order enter"><span class="sit">${q.it.e}</span><div class="bub">${esc(q.it.sit)}</div></div>`
        :`<div class="order enter"><span class="sit">${q.it.e}</span><button class="btn gold" id="gHear" style="font-size:24px">🔊 다시 듣기</button></div>`}
      <div class="gopts" id="gOpts" style="pointer-events:none">${q.opts.map((o,i)=>`<button class="opt drop" style="--k:${i+(q.mode==='speak'?3:1)}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sm" id="gQuit">그만하기</button></div></div></div>`;
  if($('#gHear'))$('#gHear').onclick=()=>say(q.it.w);
  {const gq=G.i;setTimeout(()=>{const o=$('#gOpts');if(o&&G.i===gq)o.style.pointerEvents='';},(q.opts.length+(q.mode==='speak'?3:1))*550+300);}
  $('#gQuit').onclick=()=>{G.on=false;G.end=false;renderGame();};
  $('#v-game').querySelectorAll('.gopts .opt').forEach(b=>b.onclick=()=>{
    if(G.lock)return;G.lock=true;const ok=b.dataset.v===q.ans;
    if(ok){b.classList.remove('drop');b.classList.add('ok','pop');beep(true);G.score[q.p]++;G.tray[q.p].push(q.dish);say('딩동댕! '+q.ans);}
    else{b.classList.remove('drop');b.classList.add('no','shake');beep(false);$('#v-game').querySelectorAll('.gopts .opt').forEach(x=>{if(x.dataset.v===q.ans)x.classList.add('ok');});say('정답은 '+q.ans);}
    G.log.push({p:q.p,ans:q.ans,ok});G.i++;

  if(k==='play')list=DATA.quests.map(q=>({key:q.id,label:q.title}));
  else if(k==='speak'||k==='trace')list=byLv(DATA.sents,s.level).map(x=>({key:x.t,label:clean(x.t)}));
  else list=byLv(DATA.words,s.level).map(x=>({key:x.w,label:(x.e?x.e+' ':'')+x.w}));
  const store=(k==='play'?r.quests:r[k])||{};
  const seen=new Set(list.map(x=>x.key));
  Object.keys(store).forEach(key=>{if(!seen.has(key))list.push({key,label:clean(key)});});   // 다른 단계에서 한 것도 넣기
  return list.map(x=>Object.assign(x,{v:store[x.key]||'n'}));
}
function count(list){const c={a:0,b:0,c:0,n:0};list.forEach(x=>c[x.v]=(c[x.v]||0)+1);return c;}
function bar(c,total){if(!total)return '<div class="rs-bar"></div>';
  return `<div class="rs-bar" role="img" aria-label="혼자 ${c.a}, 도움 ${c.b}, 다시 ${c.c}, 안 함 ${c.n}">${['a','b','c'].map(k=>c[k]?`<i class="k-${k}" style="width:${c[k]/total*100}%;background:var(--k)"></i>`:'').join('')}</div>`;}
function stuData(s){
  const r=REC[s.id]||{};const out={areas:{},tot:{a:0,b:0,c:0,n:0}};
  AREAS.forEach(A=>{if(A.k==='game')return;const L=itemsOf(s,A.k);const c=count(L);out.areas[A.k]={L,c};['a','b','c','n'].forEach(k=>out.tot[k]+=c[k]);});
  out.stars=r.playStars||0;out.game=r.game||null;return out;
}
function summary(s,d){
  const t=d.tot,done=t.a+t.b,name=esc(s.name);
  if(!done&&!d.game&&!d.stars)return KID?'아직 기록이 없어요. 오늘 활동을 시작해 볼까요?':`${name} 학생은 아직 기록이 없어요. 보여주기 화면의 「혼자 / 도움」 단추를 누르면 여기에 모여요.`;
  const best=AREAS.filter(A=>A.k!=='game').map(A=>({A,c:d.areas[A.k].c})).filter(x=>x.c.a>0).sort((x,y)=>y.c.a-x.c.a)[0];
  const focusAreas=AREAS.filter(A=>A.k!=='game'&&A.focus.includes(s.focus));
  const practice=[];focusAreas.forEach(A=>d.areas[A.k].L.forEach(x=>{if(x.v==='c'||x.v==='b')practice.push(x.label);}));
  const untouched=focusAreas.filter(A=>d.areas[A.k].c.a+d.areas[A.k].c.b+d.areas[A.k].c.c===0).map(A=>A.t);
  if(KID){
    let h=`혼자 해낸 것 <b>${t.a}개</b>, 도움 받아 해낸 것 <b>${t.b}개</b>!`;
    if(best)h+=` ${best.A.ic} ${best.A.t}${josa(best.A.t,'을','를')} 특히 잘했어요.`;
    if(practice.length)h+=`<br>다음에 또 해 볼 말: <b>${practice.slice(0,3).map(esc).join(' / ')}</b>`;
    return h;
  }
  let h=`혼자 해낸 것 <b>${t.a}개</b>, 도움 받아 해낸 것 <b>${t.b}개</b>, 다시 해 볼 것 <b>${t.c}개</b>예요.`;
  if(best)h+=` 혼자 해낸 것이 가장 많은 활동은 <b>${best.A.ic} ${best.A.t}</b>(${best.c.a}개)예요.`;
  if(d.game)h+=` 주문 왕 게임은 <b>${d.game.score}/${d.game.total}</b> 맞혔어요.`;
  if(practice.length)h+=`<br>🔁 더 연습할 것 (중점 활동): ${practice.slice(0,5).map(esc).join(' / ')}${practice.length>5?` 외 ${practice.length-5}개`:''}`;
  if(untouched.length)h+=`<br>⏳ 아직 기록이 없는 중점 활동: ${untouched.join(', ')}`;
  return h;
}
function stuHTML(s){
  const d=stuData(s),t=d.tot,total=t.a+t.b+t.c+t.n;
  const dishes=['🥟','🍜','🍝','🍲','🍛','🍖','🥢','🥄'];
  const plate=Array.from({length:Math.min(t.a,16)},(_,i)=>dishes[i%dishes.length]).join('')||'🍽️';
  let h=`<section class="rs-stu" style="--st:${s.color};--st-soft:color-mix(in srgb, ${s.color} 12%, #fff)">`;
  if(KID)h+=`<div class="rs-kid"><div class="big">🎉 ${esc(s.name)}, 오늘 이만큼 해냈어요!</div><div class="stars">${'⭐'.repeat(Math.min(d.stars,12))}</div></div>`;
  h+=`<div class="rs-top"><span class="rs-ic">${s.ic}</span><div style="flex:1;min-width:240px">
      <div class="rs-nm">${esc(s.name)} <span class="chip st">${FOCUS[s.focus]||''}</span><span class="chip">${s.level}단계</span></div>
      <div class="rs-goal">🎯 ${esc(s.goal)}</div>
      <div style="margin-top:12px">${bar(t,total)}<div class="rs-leg"><span class="k-a">혼자 ${t.a}</span><span class="k-b">도움 ${t.b}</span><span class="k-c">다시 ${t.c}</span><span class="k-n">아직 ${t.n}</span>${d.stars?`<span style="--k:transparent">⭐ 놀이 별 ${d.stars}</span>`:''}</div></div></div>
    <div class="rs-plate"><div class="dish" aria-hidden="true">${plate}</div><div class="cap">혼자 해낸 ${t.a}개</div></div></div>`;
  h+=`<div class="rs-say">${summary(s,d)}</div><div class="rs-grid">`;
  AREAS.forEach(A=>{
    const foc=A.focus.length===1&&A.focus.includes(s.focus);
    if(A.k==='game'){const g=d.game;
      h+=`<div class="rs-area"><div class="ah">${A.ic} ${A.t}<span class="n">${g?g.score+' / '+g.total+' 맞힘':'아직 안 함'}</span></div>
        ${g&&g.log&&g.log.length?`<div class="rs-items">${g.log.map(l=>`<span class="rs-it ${l.ok?'a':'x'}">${l.ok?'⭕':'❌'} ${esc(l.a)}</span>`).join('')}</div>`:`<div class="rs-empty">${g?'맞힌 개수만 남아 있어요.':'마무리 게임을 하면 여기에 나와요.'}</div>`}</div>`;
      return;}
    const {L,c}=d.areas[A.k];
    h+=`<div class="rs-area ${foc?'focus':''}"><div class="ah">${A.ic} ${A.t}${foc?'<span class="chip st">중점</span>':''}<span class="n">${c.a+c.b} / ${L.length}</span></div>
      ${bar(c,L.length)}
      <div class="rs-items">${L.map(x=>`<span class="rs-it ${x.v}" title="${x.v==='a'?A.ok:x.v==='b'?A.help:x.v==='c'?'다시 해요':'아직 안 했어요'}">${x.v==='a'?'✅':x.v==='b'?'🤝':x.v==='c'?'🔁':'·'} ${esc(x.label)}</span>`).join('')}</div></div>`;
  });
  return h+'</div></section>';
}

/* ── 창 ── */
const M=document.createElement('div');M.className='modal hidden';M.id='resModal';M.dataset.dyn='1';
M.innerHTML='<div class="rs-box"><div class="rs-head"><div class="t">'+(KID?'📊 내 결과':'📊 학생별 결과')+'</div><div class="rs-tabs" id="rsTabs"></div><div class="rs-tools" id="rsTools"></div></div><div class="rs-body" id="rsBody"></div></div>';
document.body.appendChild(M);
M.addEventListener('click',e=>{if(e.target===M&&!ST.locked)close();});
const btn=document.createElement('button');btn.className='tbtn txt';btn.id='resBtn';btn.dataset.dyn='1';btn.title='학생별 결과 보기';btn.textContent=KID?'📊 내 결과':'📊 결과';
btn.onclick=()=>open();
$('.topr').insertBefore(btn,$('#sndBtn'));

function render(){
  if(M.classList.contains('hidden'))return;
  const S=DATA.students;if(ST.sel!=='all'&&!S.find(s=>s.id===ST.sel))ST.sel='all';
  $('#rsTabs').innerHTML=S.length>1?[`<button data-s="all" class="${ST.sel==='all'?'on':''}">👥 모두</button>`].concat(S.map(s=>`<button data-s="${s.id}" class="${ST.sel===s.id?'on':''}" style="--c:${s.color}">${s.ic} ${esc(s.name)}</button>`)).join(''):'';
  $('#rsTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ST.sel=b.dataset.s;render();});
  const sync=window.SYNC&&SYNC.teacher();
  $('#rsTools').innerHTML=`${sync?`<button class="btn sm" id="rsPush">${SYNC.resultOn()?'📡 태블릿 결과 닫기':'📡 태블릿에도 띄우기'}</button>`:''}
    ${KID?'':'<button class="btn sm" id="rsPrint">🖨️ 인쇄</button>'}${ST.locked?'':'<button class="btn sm" id="rsClose">닫기 ✕</button>'}`;
  if($('#rsPush'))$('#rsPush').onclick=()=>{SYNC.setResult(!SYNC.resultOn());render();toast(SYNC.resultOn()?'학생 태블릿에 각자 결과를 띄웠어요':'학생 태블릿의 결과 창을 닫았어요');};
  if($('#rsPrint'))$('#rsPrint').onclick=()=>{document.body.classList.add('res-print');setTimeout(()=>window.print(),50);};
  if($('#rsClose'))$('#rsClose').onclick=close;
  const list=ST.sel==='all'?S:S.filter(s=>s.id===ST.sel);
  const y=$('#rsBody').scrollTop;
  $('#rsBody').innerHTML=list.map(stuHTML).join('');
  $('#rsBody').scrollTop=y;
}
function open(byTeacher){ST.openBy=byTeacher?'teacher':'me';ST.locked=!!byTeacher;M.classList.remove('hidden');try{speechSynthesis.cancel();}catch(e){}render();}
function close(){M.classList.add('hidden');ST.openBy=null;ST.locked=false;}
window.addEventListener('afterprint',()=>document.body.classList.remove('res-print'));
window.RES={open,close,render,isOpen:()=>!M.classList.contains('hidden'),openedByTeacher:()=>ST.openBy==='teacher'};
})();
</script>

<script>
/* ═════════ 📡 태블릿 연결 (GitHub Pages + Firebase) ═════════
   Firebase 실시간 데이터베이스 주소를 아래에 넣어 두면 선생님이 따로 입력하지 않아도 돼요.
   예: 'https://my-class-default-rtdb.asia-southeast1.firebasedatabase.app'
   비워 두면 선생님 화면의 「📡 태블릿」 창에서 붙여 넣을 수 있어요. */
const FIREBASE_DB_URL='';

(function(){
'use strict';
const VIEW_NAME={home:'🏠 수업 안내',play:'1 동기유발',show:'2 보여주기',ws:'3 활동지',game:'4 마무리 게임'};
const Q=new URLSearchParams(location.search);
const SID=Q.get('s');                       // 학생 태블릿: ?s=A
const ROOM_Q=(Q.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const IS_STU=!!SID;
let ROOM=ROOM_Q||'';
let DBURL=FIREBASE_DB_URL||Q.get('db')||(()=>{try{return localStorage.getItem('cnshop-dburl')||'';}catch(e){return '';}})();
let IS_TEACHER=!IS_STU&&!!ROOM&&Q.get('t')==='1';
let fb=null,connected=false,ctrl={view:'home',lock:true},online={},lastPushed='',lastDataAt=0,resetSeen=0;
const BASE=location.href.split('?')[0].split('#')[0];
const stamp=()=>Date.now();

/* ── 외부 스크립트 ── */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.dataset.dyn='1';s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s);});}
async function initFB(){
  if(fb)return fb;
  if(!DBURL)throw new Error('nourl');
  if(!window.firebase){
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  }
  const app=(firebase.apps||[]).find(a=>a.name==='cnshop')||firebase.initializeApp({databaseURL:DBURL},'cnshop');
  fb=app.database();
  fb.ref('.info/connected').on('value',s=>{connected=!!s.val();paintChip();if(connected&&IS_STU)presence();});
  return fb;
}
const R=p=>fb.ref('cnshop/'+ROOM+(p?'/'+p:''));
function newRoom(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<5;i++)r+=A[Math.floor(Math.random()*A.length)];return r;}
function stuLink(id){return BASE+'?'+(ROOM&&DBURL?'room='+ROOM+'&':'')+'s='+encodeURIComponent(id)+(ROOM&&DBURL&&!FIREBASE_DB_URL?'&db='+encodeURIComponent(DBURL):'');}

/* ── 기록 합치기 ── */
function mergeRec(a,b){
  a=a||{};b=b||{};const o=JSON.parse(JSON.stringify(a));
  Object.keys(b).forEach(k=>{const v=b[k];
    if(k==='playStars')o[k]=Math.max(+o[k]||0,+v||0);
    else if(k==='game')o[k]=v||o[k];
    else if(v&&typeof v==='object')o[k]=Object.assign({},o[k]||{},v);
    else o[k]=v;});
  return o;
}

/* ── 위쪽 막대 ── */
const chip=document.createElement('div');chip.className='sync-chip';chip.dataset.dyn='1';
const tbtn=document.createElement('button');tbtn.className='tbtn txt';tbtn.id='syncBtn';tbtn.title='학생 태블릿 연결';tbtn.textContent='📡 태블릿';tbtn.dataset.dyn='1';
function paintChip(){

    const s=stu(SID);const st=!ROOM?'혼자 쓰기':connected?'연결됨':'연결 중…';
    chip.innerHTML=`<span class="sync-dot ${!ROOM?'':connected?'on':'off'}"></span>${esc(s?s.name:SID)} 태블릿 · ${st}${ROOM&&ctrl.lock?' · 👀 선생님과 함께':''}`;
  }else if(IS_TEACHER){
    const n=Object.keys(online).length;

  }
}
if(IS_STU)$('.topr').prepend(chip);else $('.topr').prepend(tbtn);

/* ── 화면 전환 감싸기 ── */
const _go=go;
go=function(v){
  if(IS_STU&&ROOM&&fb&&connected&&ctrl.lock&&ctrl.view&&v!==ctrl.view){toast('👀 선생님과 함께 넘어가요');return;}

/* 선생님이 고치면 태블릿에도 보내기 */

persist=function(){_persist();if(IS_TEACHER&&fb){clearTimeout(pubT);pubT=setTimeout(pubData,900);}};
function pubData(){if(!fb)return;R('data').set({json:JSON.stringify(DATA),at:DATA.savedAt||stamp()});}

/* ── HTML 내보내기 고치기: 모든 스크립트가 들어가게 ── */
async function sourceHTML(){
  if(/^https?:/.test(location.protocol)){
    try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});const t=await r.text();if(t.includes('id="userData"')&&t.includes('cnshop/'))return t;}catch(e){}
  }
  const c=document.documentElement.cloneNode(true);
  c.querySelectorAll('[data-dyn]').forEach(n=>n.remove());
  ['v-home','v-play','v-show','v-ws','v-game','who','mbody','etabs'].forEach(id=>{const n=c.querySelector('#'+id);if(n)n.innerHTML='';});
  ['v-play','v-show','v-ws','v-game'].forEach(id=>{const n=c.querySelector('#'+id);if(n)n.classList.add('hidden');});
  const m=c.querySelector('#modal');if(m)m.classList.add('hidden');
  const t=c.querySelector('#toast');if(t){t.className='';t.textContent='';}
  c.querySelectorAll('#stages button').forEach(b=>b.classList.remove('on'));
  const b=c.querySelector('body');if(b){b.removeAttribute('style');b.removeAttribute('class');}
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
exportHTML=async function(){
  const out=Object.assign({},DATA,{docId:'d'+Date.now().toString(36),savedAt:Date.now()});
  const json=JSON.stringify(out).replace(/</g,'\\u003c');
  const src=await sourceHTML();
  const html=src.replace(/(<script id="userData" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  const name=`중국집에서하는말_편집본_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.html`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('💾 '+name+' 파일로 내보냈어요');
};

/* ═════════ 학생 태블릿 ═════════ */

}
function applyData(v){
  if(!v||!v.json||v.at===lastDataAt)return;
  let L;try{L=JSON.parse(v.json);}catch(e){return;}
  lastDataAt=v.at;
  try{localStorage.setItem(KEY,JSON.stringify(L));}catch(e){}
  DATA=Object.assign(clone(DEF),L);
  ['students','words','sents','menu','objs','quests','order'].forEach(k=>{if(!Array.isArray(DATA[k])||!DATA[k].length)DATA[k]=clone(DEF[k]);});
  DATA.ws=DATA.ws||{};DATA.wsHTML=DATA.wsHTML||{};DATA.lesson=DATA.lesson||clone(DEF.lesson);

}
function applyCtrl(v){
  ctrl=Object.assign({view:'home',lock:true},v||{});
  document.body.classList.toggle('stu-lock',!!ctrl.lock);
  if((ctrl.resetAt||0)>resetSeen){
    if(resetSeen){REC[SID]={};saveRec();lastPushed='';}
    resetSeen=ctrl.resetAt;try{localStorage.setItem('cnshop-reset-'+ROOM,String(resetSeen));}catch(e){}
  }
  if(ctrl.lock&&ctrl.view&&ctrl.view!==VIEW)go(ctrl.view);
  if(window.RES){if(ctrl.resultOn)RES.open(true);else if(RES.openedByTeacher())RES.close();}
  paintChip();
}
function presence(){if(!fb||!connected)return;const r=R('online/'+SID);r.onDisconnect().remove();r.set({view:VIEW,at:stamp()});}
function pushRec(){
  if(!fb)return;const j=JSON.stringify(REC[SID]||{});
  if(j===lastPushed)return;lastPushed=j;if(window.RES)RES.render();R('rec/'+SID).set({json:j,at:stamp()});
}
async function startStudent(){
  document.body.classList.add('stu-mode');
  if(!onlyMe())return;
  renderWho();go('home');paintChip();
  if(!ROOM)return;                              // 주소에 방이 없으면 혼자 쓰기
  if(!DBURL){chip.innerHTML='<span class="sync-dot off"></span>연결 주소가 없어요';return;}
  try{resetSeen=+localStorage.getItem('cnshop-reset-'+ROOM)||0;}catch(e){}
  try{await initFB();}catch(e){chip.innerHTML='<span class="sync-dot off"></span>연결할 수 없어요 · 혼자 쓰기';toast('⚠️ 인터넷 연결을 확인해 주세요. 기록은 이 태블릿에 저장돼요.');return;}
  try{const s=await R('rec/'+SID).once('value');const v=s.val();if(v&&v.json){REC[SID]=mergeRec(REC[SID],JSON.parse(v.json));saveRec();}}catch(e){}
  R('data').on('value',s=>applyData(s.val()));
  R('ctrl').on('value',s=>applyCtrl(s.val()));
  setInterval(pushRec,1500);pushRec();
}

/* ═════════ 선생님 화면 ═════════ */
function onRec(s){
  const all=s.val()||{};let changed=false;
  Object.keys(all).forEach(id=>{const v=all[id];if(!v||!v.json)return;
    try{const m=mergeRec(REC[id],JSON.parse(v.json));if(JSON.stringify(m)!==JSON.stringify(REC[id]||{})){REC[id]=m;changed=true;}}catch(e){}});
  if(!changed)return;saveRec();
  if(window.RES&&RES.isOpen()){RES.render();return;}
  if($('#modal').classList.contains('hidden')){
    if(VIEW==='home')renderHome();
    else if(VIEW==='play'&&typeof renderSide==='function'){try{renderSide();}catch(e){}}
  }
}
async function startTeacher(quiet){
  try{await initFB();}catch(e){if(!quiet)toast(e.message==='nourl'?'먼저 Firebase 주소를 넣어 주세요.':'⚠️ Firebase에 연결할 수 없어요. 주소와 인터넷을 확인해 주세요.');IS_TEACHER=false;renderPanel();return false;}
  IS_TEACHER=true;
  try{localStorage.setItem('cnshop-room',ROOM);}catch(e){}
  history.replaceState(null,'',BASE+'?room='+ROOM+'&t=1'+(FIREBASE_DB_URL?'':'&db='+encodeURIComponent(DBURL)));
  const c=await R('ctrl').once('value');ctrl=Object.assign({lock:true},c.val()||{});
  R('ctrl').update({view:VIEW,lock:ctrl.lock,at:stamp()});
  pubData();
  R('rec').on('value',onRec);
  R('online').on('value',s=>{online=s.val()||{};paintChip();if(!$('#syncPanel').classList.contains('hidden'))paintOnline();});
  paintChip();renderPanel();
  return true;
}
function stopTeacher(){
  if(fb){try{R('rec').off();R('online').off();}catch(e){}}
  IS_TEACHER=false;online={};history.replaceState(null,'',BASE);tbtn.textContent='📡 태블릿';renderPanel();
}

/* ── 창 ── */
const panel=document.createElement('div');panel.className='modal hidden';panel.id='syncPanel';panel.dataset.dyn='1';
panel.innerHTML='<div class="sp-box"><div class="mhead"><div class="t">📡 학생 태블릿 연결</div><button class="btn sm" id="spClose">닫기 ✕</button></div><div class="sp-body" id="spBody"></div></div>';
document.body.appendChild(panel);
panel.addEventListener('click',e=>{if(e.target===panel)panel.classList.add('hidden');});
$('#spClose').onclick=()=>panel.classList.add('hidden');
tbtn.onclick=()=>{panel.classList.remove('hidden');renderPanel();};

let qrLib=null;
function needQR(){if(!qrLib)qrLib=window.QRCode?Promise.resolve():loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');return qrLib;}
function drawQRs(){needQR().then(()=>{document.querySelectorAll('.sp-qr[data-u]').forEach(el=>{el.innerHTML='';try{new QRCode(el,{text:el.dataset.u,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});}catch(e){el.textContent='QR을 만들 수 없어요';}});}).catch(()=>{document.querySelectorAll('.sp-qr').forEach(el=>el.remove());});}
function paintOnline(){
  DATA.students.forEach(s=>{const n=document.querySelector(`.sp-stu[data-id="${s.id}"] .st`);if(!n)return;const o=online[s.id];
    n.innerHTML=o?`<span class="sync-dot on"></span>연결됨 · ${VIEW_NAME[o.view]||''}`:`<span class="sync-dot off"></span>아직 연결 안 됨`;});
}
function renderPanel(){
  const B=$('#spBody');if(!B)return;
  const local=location.protocol==='file:';
  let h='';
  if(!IS_TEACHER){
    h+=`<div class="card"><div class="h3">어떻게 쓰나요?</div>
      <div class="sub" style="font-size:15px">이 수업 자료를 <b>GitHub Pages</b>에 올리면 학생 태블릿에서 주소(또는 QR)로 열 수 있어요.<br>
      · <b>그냥 열기</b>: 학생별 주소로 열면 그 학생 화면만 나와요. 기록은 태블릿 안에 남아요.<br>
      · <b>실시간 연결</b>(Firebase): 선생님 화면을 따라 태블릿이 함께 넘어가고, 학생 기록이 선생님 화면에 바로 모여요.</div>
      ${local?'<p class="sub" style="color:var(--no);margin-top:8px">⚠️ 지금은 컴퓨터 안의 파일로 열려 있어요. 태블릿에서 열려면 GitHub Pages 주소로 열어 주세요.</p>':''}</div>`;
    h+=`<div class="card"><div class="h3">⚡ 실시간 연결 시작</div>
      ${FIREBASE_DB_URL?`<p class="sub">Firebase 주소가 파일에 들어 있어요.</p>`:`<p class="sub">Firebase 실시간 데이터베이스 주소를 붙여 넣으세요. (한 번 넣으면 이 기기에 기억돼요)</p>
      <div class="row" style="margin-top:8px"><input class="sp-in" id="spUrl" placeholder="https://○○○-default-rtdb.asia-southeast1.firebasedatabase.app" value="${esc(DBURL)}"></div>`}
      <div class="row" style="margin-top:10px"><button class="btn pri" id="spStart">📡 수업 방 열기</button>
      ${(()=>{let r='';try{r=localStorage.getItem('cnshop-room')||'';}catch(e){}return r?`<button class="btn" id="spResume">↩︎ 지난 방(${esc(r)}) 다시 열기</button>`:'';})()}</div>
      <details style="margin-top:12px"><summary class="j" style="cursor:pointer;font-size:17px">Firebase 주소 만드는 법 (처음 한 번, 5분)</summary>
      <ol class="sp-steps" style="margin-top:8px">
        <li><code>console.firebase.google.com</code> 에 구글 계정으로 들어가 <b>프로젝트 추가</b> (애널리틱스는 꺼도 돼요).</li>
        <li>왼쪽 <b>빌드 → Realtime Database → 데이터베이스 만들기</b>. 위치는 <b>싱가포르(asia-southeast1)</b>, <b>테스트 모드</b>로 시작.</li>
        <li><b>규칙</b> 탭에 함께 드린 <code>database.rules.json</code> 내용을 붙여 넣고 게시해요.</li>
        <li>데이터 탭 맨 위의 <code>https://…firebasedatabase.app</code> 주소를 복사해서 위 칸에 붙여 넣어요.</li></ol></details></div>`;
    h+=`<div class="card"><div class="h3">🔗 그냥 열기용 학생 주소</div><div class="sp-studs">${DATA.students.map(s=>{const u=BASE+'?s='+encodeURIComponent(s.id);
      return `<div class="card sp-stu" style="--st:${s.color}"><div class="nm">${s.ic} ${esc(s.name)}</div><div class="sp-link">${esc(u)}</div><button class="btn sm" data-copy="${esc(u)}">주소 복사</button></div>`;}).join('')}</div></div>`;
  }else{
    h+=`<div class="card"><div class="row" style="align-items:flex-end;gap:18px;flex-wrap:wrap"><div><div class="sub">수업 방 번호</div><div class="sp-room">${ROOM}</div></div>
      <div style="flex:1;min-width:240px;display:flex;flex-direction:column;gap:10px">
        <label class="sp-sw"><input type="checkbox" id="spLock" ${ctrl.lock?'checked':''}> 태블릿이 선생님 화면을 따라오게 하기</label>
        <div class="sub">켜 두면 학생 태블릿의 단계 단추가 숨겨지고, 선생님이 단계를 바꾸면 함께 넘어가요.</div></div></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="spReset">🧹 태블릿 기록 모두 지우기</button><button class="btn" id="spStop">연결 끊기</button></div></div>`;
    h+=`<div class="sp-studs">${DATA.students.map(s=>{const u=stuLink(s.id);
      return `<div class="card sp-stu" data-id="${s.id}" style="--st:${s.color}"><div class="nm">${s.ic} ${esc(s.name)}</div><div class="st"></div>
        <div class="sp-qr" data-u="${esc(u)}"></div><div class="sp-link">${esc(u)}</div><button class="btn sm" data-copy="${esc(u)}">주소 복사</button></div>`;}).join('')}</div>
      <p class="sub">학생 태블릿 카메라로 QR을 찍거나 주소를 열면 돼요. 학생을 더하거나 이름을 바꾸면 여기 주소도 바뀌어요.</p>`;
  }
  B.innerHTML=h;
  B.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const u=b.dataset.copy;
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('주소를 복사했어요')).catch(()=>{prompt('주소를 복사하세요',u);});});
  const st=$('#spStart');if(st)st.onclick=async()=>{
    if(!FIREBASE_DB_URL){const v=($('#spUrl').value||'').trim().replace(/\/+$/,'');
      if(!/^https:\/\/[^\s/]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(v)){toast('Firebase 주소 모양이 아니에요. https://…firebasedatabase.app 주소를 넣어 주세요.');return;}
      DBURL=v;try{localStorage.setItem('cnshop-dburl',v);}catch(e){}}
    ROOM=newRoom();st.disabled=true;await startTeacher();};
  const rs=$('#spResume');if(rs)rs.onclick=async()=>{
    if(!FIREBASE_DB_URL&&$('#spUrl')){const v=($('#spUrl').value||'').trim().replace(/\/+$/,'');if(v){DBURL=v;try{localStorage.setItem('cnshop-dburl',v);}catch(e){}}}
    try{ROOM=localStorage.getItem('cnshop-room')||newRoom();}catch(e){ROOM=newRoom();}await startTeacher();};
  const lk=$('#spLock');if(lk)lk.onchange=()=>{ctrl.lock=lk.checked;R('ctrl').update({lock:ctrl.lock,view:VIEW,at:stamp()});};
  const rz=$('#spReset');if(rz)rz.onclick=()=>{if(!confirm('모든 학생 태블릿의 말하기·읽기·쓰기·놀이·게임 기록을 지울까요?'))return;
    R('rec').remove();REC={};saveRec();R('ctrl').update({resetAt:stamp()});toast('태블릿 기록을 지웠어요');if(VIEW==='home')renderHome();};
  const sp=$('#spStop');if(sp)sp.onclick=()=>{if(confirm('태블릿 연결을 끊을까요? (방 번호는 기억해 둬요)'))stopTeacher();};
  if(IS_TEACHER){paintOnline();drawQRs();}
}

window.SYNC={teacher:()=>IS_TEACHER&&!!fb,resultOn:()=>!!ctrl.resultOn,
  setResult(on){ctrl.resultOn=!!on;if(fb)R('ctrl').update({resultOn:!!on,at:stamp()});}};
/* ── 시작 ── */
if(IS_STU)startStudent();
else if(IS_TEACHER&&DBURL)startTeacher(true);
else if(IS_TEACHER){IS_TEACHER=false;}
})();
</script>

</body>
</html>
